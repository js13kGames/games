l like you could recite something here.","Your voice echoes as you recite the words engraved on the coin.\nYou shield your eyes as the candles burst into flame, the room lit bright\nas day. Your mind is reeling, grasping for something it can't quite hold.","An old armoire holding dozens of burning votive candles. Her candles.","This is the spot, you can feel it under your feet. But your knife barely\nmakes a dent in the old hardwood - there must be a better way.","This is the spot.","A life-sized sculpture of a woman. She holds in her arms a creature, all\nlegs, heads, and arms, reaching upwards in celebration.\nOne baby fist is clutching something round and shiny.","You reach carefully through the tangled limbs.\n%y%0 You have obtained engraved coin.","A life-sized sculpture of a woman. She holds in her arms a creature, all\nlegs, heads, and arms, reaching upwards in celebration.","Your goddess has left instructions on the wall for you. The old passages\nare still alive under the entrance hallway. Your knife will do.","A sturdy wood and metal workbench, littered with debris.\nLying amidst the junk and broken tools, you spot a screwdriver.","A sturdy wood and metal workbench, littered with debris.",0,0,0,0,0,0,0,0,["SHRINE","This storage closet has been converted into some kind of shrine. The\nunpainted wooden walls are carved with words, but none of them make\nany sense to you."],["SHRINE","Her shrine. The walls are carved with instructions for her children."],["DINING ROOM","The dining room is somber and quiet. The walls are covered with\nfaded squares where paintings used to hang."],["DRAWING ROOM","You are in a dimly lit drawing room filled with faded furniture.\nThe room smells of musty upholstery."],["FOYER","You are in the foyer. The peeling paint and threadbare rugs seem even\nolder than the outside of the house.\nA dollhouse sits on a pedestal in the far corner of the room."],["GARAGE","The garage is empty, save for a few rusty shelves and the usual cobwebs.\nThere must have been other furniture here recently, you can see lines\nin the dust where a workbench used to be."],["GARAGE","The garage is empty, save for a few rusty shelves and the usual cobwebs.\nThere is a sturdy workbench near the door."],["CHARRED HALLWAY","There must have been a fire at some point. Soot and grime coat the walls,\nand the air stinks of burnt fabric."],0,0,0,0,0,["iron knife","A large iron knife etched with\ntiny symbols. It feels heavy\nin your hand."],["small silver key",'A small silver key. A note is\nattached with a piece of twine.\n\n%r"N is still here, stay on this\n%r side."'],["your uncle's letter",'%r"Dearest Emily,\n\n%r We are all in grave danger and\n%r I am running out of time. I\n%r cannot explain here but I need\n your help."\n%w[The rest of the letter has been\ncrossed out and is illegible.]'],["half-burnt notebook",'Most of the pages are too burnt\nto read, but somehow one page\nis crystal clear:\n\n%r"Our Goddess walks the hills\n%r in the shadow of the keening star\n%r and we follow in her path"'],["miniature workbench","A curiously realistic miniature\nworkbench, made of wood and metal.\nMaybe there's some use for it."],["miniature sculpture","A miniature sculpture of a woman,\nvery like the one you saw in\nthe drawing room.\nMaybe there's some use for it."],["screwdriver","A rusty, but still functional,\ncrosshead screwdriver."],["engraved coin",'An ancient coin engraved on both\nsides with a short verse:\n\n%r"Yidhra, Dream Witch,\n%r I am your child.\n%r Walk with me."']]},a={P:46,e(){this.d(),this.N=[]},U(){if(k.f%169>1){let e=this.G[0].F;for(let t=0;t<e.length;t++)for(let i=0;i<e[t].length;i++)if(this.G[0].w[t][i]){let s=this.q({x:i,y:t,z:0});if(s&&3!==s.type)f.$(i,t,s.char,this._(s));else{let s=String.fromCharCode(e[t][i]);f.$(i,t,s,this.ee(s))}}}if(f.write(0,0," ".repeat(64)),f.write(0,1," ".repeat(64)),f.write(0,2," ".repeat(64)),k.i.te){let e=a.Z[k.i.te.id][0];f.write(Math.floor((64-e.length)/2),1,e,f.se)}},d(){
