:#aaa;top:10%;left:10%;box-shadow:0 0 0 .5vmin #e5e5e5;transition:background-color 1s}</style></head><body> <div id="exit" onclick="showMenu()">x</div><div id="result"> <div class="content"> <div class="row"> <div class="square"> <div id="level" class="node"></div></div><div class="square"> <div id="time" class="node"></div></div></div><div class="row"> <div class="square"> <div id="moves" class="node"></div></div><div class="square"> <div id="back" class="node" onclick="showMenu()">menu</div></div></div></div></div><div id="game"> </div><div id="menu"> <div class="content"> <div class="row"> <div class="square"> <div id="logo" class="node">MESS</div></div><div class="square"> <div id="easy" class="node" onclick="initGame(3)">easy</div></div></div><div class="row"> <div class="square"> <div id="medium" class="node" onclick="initGame(4)">medium</div></div><div class="square"> <div id="hard" class="node" onclick="initGame(5)">hard</div></div></div></div></div><script>function isCorrect(permutation1,permutation2){for(var i=0;i<permutation1.length;i++)if(permutation1[i]!==permutation2[i])return!1;return!0}function randomEvenPermutation(n){for(var array=[],i=0;i<n;i++)array.push(i);for(;isCorrect(array,actualPermutation);)shuffle(array),isEven(array)||swap(array,0,1);return array}function swap(array,x,y){temp=array[x],array[x]=array[y],array[y]=temp}function isEven(array){for(var inversions=0,i=0;i<array.length-2;i++)for(var j=i+1;j<array.length-1;j++)array[j]<array[i]&&inversions++;return inversions%2==0}function shuffle(array){for(var randomIndex,currentIndex=array.length-1;0!==currentIndex;)randomIndex=Math.floor(Math.random()*currentIndex),swap(array,currentIndex-=1,randomIndex);return array}function reversePermutation(){activeIndex=op*op-1-activeIndex;for(var i=0;i<op*op/2;i++)swapNodes(i,op*op-1-i)}function inversePermutation(){for(var array=new Array(op*op),i=0;i<actualPermutation.length;i++)array[actualPermutation[i]]=i;for(i=0;i<actualPermutation.length;i++)actu
