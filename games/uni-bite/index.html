		// -------------------------
		// UPDATE LOOP
		// -------------------------

		function update(deltaTime) {
			if (!gameStats.isGameStarted) return;
			if (gameStats.isGameOver) return;

			if (gameStats.poisonFlash > 0) {
				gameStats.poisonFlash -= deltaTime;
			}

			if (gameStats.bonusFlash > 0) {
				gameStats.bonusFlash -= deltaTime;
			}

			// countdown managing
			if (!gameStats.timeTimer) gameStats.timeTimer = 0;
			gameStats.timeTimer += deltaTime;

			const boxSpeed = 0.012 + (gameStats.level * 0.0015);
			box.t += boxSpeed;

			// every 1000ms
			if (gameStats.timeTimer >= 1000) {
				gameStats.timeTimer -= 1000;
				gameStats.timeLeft--;

				// check if time is over
				if (gameStats.timeLeft <= 0) {
					gameStats.timeLeft = 0;
					gameStats.isGameOver = true;
				}
			}

			const range = Math.min(W * 0.35, 300);

			box.x = W / 2 + Math.sin(box.t) * range;

			box.y =
				H / 2 +
				Math.sin(box.t * 2) * 25;

			updateBoxState(deltaTime);
			updateCandies(deltaTime);
			updateEffects();
		}

		// -------------------------

		// -------------------------

		function draw() {
			ctx.clearRect(0, 0, W, H);

			if (!gameStats.isGameStarted) {
				drawStartScreen();
				return;
			}

			drawBox();
			drawCandies();
			drawUnicorn();
			drawEffects();

			const isFlashing = gameStats.poisonFlash > 0 && Math.floor(gameStats.poisonFlash / 75) % 2 !== 0;
			const isBonusFlashing = gameStats.bonusFlash > 0;

			if (isFlashing) {
				ctx.fillStyle = "rgba(50, 255, 50, 0.6)";
				ctx.fillRect(0, 0, W, H);
			} else if (isBonusFlashing) {
				ctx.fillStyle = "rgba(255, 255, 255, 0.71)";
				ctx.fillRect(0, 0, W, H);
			}

			drawUI();

			if (gameStats.isGameOver) {
				drawGameOver();
			}
		}

		// -------------------------
		// DRAW TEXT
		// -------------------------

		function drawPixelText(text, x, y, size, color, align = "left") {
			ctx.fillStyle = color;
			const str = String(text).toLowerCase();

			let totalWidth = 0;
			for (let i = 0; i < str.length; i++) {
				totalWidth += (str[i] === " ") ? 3 * size : 4 * size;
			}

			let cursorX = align === "center" ? x - (totalWidth / 2) : x;

			for (let i = 0; i < str.length; i++) {
				const char = str[i];

				if (pixelFont[char]) {
					const pattern = pixelFont[char];

					for (let p = 0; p < pattern.length; p++) {
						if (pattern[p] === "1") {
							const px = (p % 3) * size;
							const py = Math.floor(p / 3) * size;
							ctx.fillRect(cursorX + px, y + py, size, size);
						}
					}
					cursorX += 4 * size;
				} else if (char === " ") {
					cursorX += 3 * size;
				}
			}
		}

			let timeColor = "#FFFFFF";
			if (gameStats.timeLeft <= 20) {
				const isBlinking = Math.floor(performance.now() / 250) % 2 === 0;
				timeColor = isBlinking ? "#FF0000" : "#FFD700";
			}

			drawPixelText(timeText, W - 80, 24, 8, timeColor);

		// -------------------------
		// BOX
		// -------------------------

		function drawBox() {
			const frameW = 64;
			const frameH = 64;
			const currentScale = box.scale;

			ctx.drawImage(
				boxSprite,
				box.frame * frameW,
				0,
				frameW,
				frameH,
				Math.round(box.x - (frameW * currentScale) / 2),
				Math.round(box.y - (frameH * currentScale) / 2),
				frameW * currentScale,
				frameH * currentScale
			);
		}

		function updateBoxState(deltaTime) {

			box.stateTimer += deltaTime;

			switch (box.state) {

				case "closed":

					box.frame = 0;

					if (box.stateTimer >= BOX_TIMINGS.closed) {
						box.state = "opening";
						box.stateTimer = 0;
					}

					break;


				case "opening":
					box.frame = Math.min(
						3,
						Math.floor(
							box.stateTimer /
							(BOX_TIMINGS.opening / 4)
						)
					);

					if (box.stateTimer >= BOX_TIMINGS.opening) {
						box.state = "open";
						box.stateTimer = 0;
						box.frame = 3;

						box.pattern = CANDY_PATTERNS[
							Math.floor(Math.random() * CANDY_PATTERNS.length)
						];

						box.spawnTimer = 0;
						box.spawnIndex = 0;
					}
					break;


				case "open":
					box.frame = 3;
					box.spawnTimer += deltaTime;

					const currentInterval = box.pattern.interval * (1 - (gameStats.level * 0.05));
					if (
						box.spawnIndex < box.pattern.types.length &&
						box.spawnTimer >= currentInterval
					) {
						spawnCandy(box.spawnIndex);
						box.spawnIndex++;
						box.spawnTimer = 0;
					}

					if (box.stateTimer >= BOX_TIMINGS.open) {
						box.state = "closing";
						box.stateTimer = 0;
					}

					break;


				case "closing":

					// frame 3 → 2 → 1 → 0

					box.frame = Math.max(
						0,
						3 - Math.floor(
							box.stateTimer /
							(BOX_TIMINGS.closing / 4)
						)
					);

					if (box.stateTimer >= BOX_TIMINGS.closing) {
						box.state = "closed";
						box.stateTimer = 0;
						box.frame = 0;
					}

					break;
			}
		}

		// -------------------------
		// CANDIES
		// -------------------------

		function drawCandies() {
			candies.forEach(candy => {
				const sprite = (candy.type === "rainbow" || candy.type === "clock")
					? candyRainbowSprite : candyRegularSprite;

				const currentScale = candy.scale;
				const size = 16 * currentScale;

				if (candy.type === "rotten") {
					ctx.filter = "sepia(1) hue-rotate(70deg) saturate(3)";
				} else if (candy.type === "clock") {
					ctx.filter = "brightness(1.5) sepia(1) hue-rotate(-20deg) saturate(5)";
				}

				ctx.drawImage(
					sprite,
					candy.frame * 16,
					0,
					16,
					16,
					candy.x - size / 2,
					candy.y - size / 2,
					size,
					size
				);

				ctx.filter = "none";
			});
		}

		// -------------------------
		// SPAWN CANDIES
		// -------------------------

		function spawnCandy(index) {
			let actualType = box.pattern.types[index];

			const chance = Math.random();
			if (chance < 0.15) {
				actualType = "rotten";
			} else if (chance < 0.25 && gameStats.timeLeft <= 20) {
				actualType = "clock";
			}

			candies.push({
				x: box.x,
				y: box.y - 25,
				vx: box.pattern.velocities[index],
				vy: -2.2,
				type: actualType,
				frame: 0,
				frameTimer: 0,
				scale: 6
			});
		}

		function updateCandies(deltaTime) {
			candies = candies.filter(candy => {

				// 1. EATING CANDY
				if (checkCandyCollision(candy)) {
					if (candy.type === "rotten") {
						// MALUS
						playSfx(bufMalus); // malus sound

						gameStats.combo = 0;
						gameStats.score = Math.max(0, gameStats.score - 50);
						gameStats.timeLeft = Math.max(0, gameStats.timeLeft - 3);
						gameStats.poisonFlash = 300;
						spawnFloatingText(candy.x, candy.y - 30, "--3", "#11cc00");

					} else if (candy.type === "clock") {
						// BONUS
						playSfx(bufBonus); // bonus sound

						gameStats.combo++;
						if (gameStats.combo > gameStats.maxCombo) gameStats.maxCombo = gameStats.combo;
						gameStats.score += 5 * gameStats.combo;
						gameStats.timeLeft += 5;
						gameStats.bonusFlash = 80;
						spawnFloatingText(candy.x, candy.y - 30, "+5", "#FFD700");

					} else {
						// regular or rainbow
						if (candy.type === "rainbow") {
							playSfx(bufMunch); // rainbow sound
						} else {
							playSfx(bufMunch); // munch sound
						}

						gameStats.combo++;
						if (gameStats.combo > gameStats.maxCombo) gameStats.maxCombo = gameStats.combo;
						const basePoints = candy.type === "rainbow" ? 3 : 1;
						if (candy.type === "rainbow") gameStats.rainbows++;
						const totalPoints = basePoints * gameStats.combo;
						gameStats.score += totalPoints;
					}

					gameStats.level = Math.min(10, Math.floor(gameStats.score / 40));
					spawnParticles(candy.x, candy.y, candy.type);
					return false;
				}

				// 2. MISSING CANDY
				if (candy.y >= H + 50) {
					if (candy.type !== "rotten") {
						gameStats.missed++;
						gameStats.combo = 0; // restart combo
					}
					return false;
				}

				return true;
			});

			candies.forEach(candy => {
				candy.x += candy.vx;
				candy.y += candy.vy;
				const currentGravity = 0.045 + (gameStats.level * 0.002);
				candy.vy += currentGravity;
			});
		}

		function checkCandyCollision(candy) {
			if (unicorn.frame !== 1) {
				return false;
			}

			const distanceX = candy.x - unicorn.x;
			const distanceY = candy.y - unicorn.y;

			const distance = Math.sqrt(
				distanceX * distanceX +
				distanceY * distanceY
			);

			const hitRadius = 12 * unicorn.scale;

			return distance < hitRadius;
		}

		// -------------------------
		// UNICORN
		// -------------------------

		function drawUnicorn() {
			const currentScale = unicorn.scale;
			const width = unicorn.w * currentScale;
			const height = unicorn.h * currentScale;

			const isFlashing = gameStats.poisonFlash > 0 && Math.floor(gameStats.poisonFlash / 75) % 2 !== 0;
			const isBonusFlashing = gameStats.bonusFlash > 0;

			if (isFlashing) {
				ctx.filter = "brightness(2) sepia(1) hue-rotate(70deg) saturate(5)";
			} else if (isBonusFlashing) {
				ctx.filter = "brightness(3)";
			}

			ctx.drawImage(
				unicornSprite,
				unicorn.frame * unicorn.w,
				0,
				unicorn.w,
				unicorn.h,
				unicorn.x - width / 2,
				unicorn.y - height / 2,
				width,
				height
			);

			ctx.filter = "none";
		}

		// -------------------------
		// SOUNDBOX AUDIO ENGINE
		// -------------------------

		var CPlayer = function () {

			//--------------------------------------------------------------------------
			// Private methods
			//--------------------------------------------------------------------------

			// Oscillators
			var osc_sin = function (value) {
				return Math.sin(value * 6.283184);
			};

			var osc_saw = function (value) {
				return 2 * (value % 1) - 1;
			};

			var osc_square = function (value) {
				return (value % 1) < 0.5 ? 1 : -1;
			};

			var osc_tri = function (value) {
				var v2 = (value % 1) * 4;
				if (v2 < 2) return v2 - 1;
				return 3 - v2;
			};

				// 174.61.. / 44100 = 0.003959503758 (F3)
				return 0.003959503758 * (2 ** ((n - 128) / 12));
			};

			var createNote = function (instr, n, rowLen) {
				var osc1 = mOscillators[instr.i[0]],
					o1vol = instr.i[1],
					o1xenv = instr.i[3] / 32,
					osc2 = mOscillators[instr.i[4]],
					o2vol = instr.i[5],
					o2xenv = instr.i[8] / 32,
					noiseVol = instr.i[9],
					attack = instr.i[10] * instr.i[10] * 4,
					sustain = instr.i[11] * instr.i[11] * 4,
					release = instr.i[12] * instr.i[12] * 4,
					releaseInv = 1 / release,
					expDecay = -instr.i[13] / 16,
					arp = instr.i[14],
					arpInterval = rowLen * (2 ** (2 - instr.i[15]));

				var noteBuf = new Int32Array(attack + sustain + release);

				// Re-trig oscillators
				var c1 = 0, c2 = 0;

				// Local variables.
				var j, j2, e, t, rsample, o1t, o2t;

				// Generate one note (attack + sustain + release)
				for (j = 0, j2 = 0; j < attack + sustain + release; j++, j2++) {
					if (j2 >= 0) {
						// Switch arpeggio note.
						arp = (arp >> 8) | ((arp & 255) << 4);
						j2 -= arpInterval;

						// Calculate note frequencies for the oscillators
						o1t = getnotefreq(n + (arp & 15) + instr.i[2] - 128);
						o2t = getnotefreq(n + (arp & 15) + instr.i[6] - 128) * (1 + 0.0008 * instr.i[7]);
					}

					// Envelope
					e = 1;
					if (j < attack) {
						e = j / attack;
					} else if (j >= attack + sustain) {
						e = (j - attack - sustain) * releaseInv;
						e = (1 - e) * (3 ** (expDecay * e));
					}

					// Oscillator 1
					c1 += o1t * e ** o1xenv;
					rsample = osc1(c1) * o1vol;

					// Oscillator 2
					c2 += o2t * e ** o2xenv;
					rsample += osc2(c2) * o2vol;

					// Noise oscillator
					if (noiseVol) {
						rsample += (2 * Math.random() - 1) * noiseVol;
					}

					// Add to (mono) channel buffer
					noteBuf[j] = (80 * rsample * e) | 0;
				}

				return noteBuf;
			};


			//--------------------------------------------------------------------------
			// Private members
			//--------------------------------------------------------------------------

			// Array of oscillator functions
			var mOscillators = [
				osc_sin,
				osc_square,
				osc_saw,
				osc_tri
			];

			// Private variables set up by init()
			var mSong, mLastRow, mCurrentCol, mNumWords, mMixBuf;


			//--------------------------------------------------------------------------
			// Initialization
			//--------------------------------------------------------------------------

			this.init = function (song) {
				// Define the song
				mSong = song;

				// Init iteration state variables
				mLastRow = song.endPattern;
				mCurrentCol = 0;

				// Prepare song info
				mNumWords = song.rowLen * song.patternLen * (mLastRow + 1) * 2;

				// Create work buffer (initially cleared)
				mMixBuf = new Int32Array(mNumWords);
			};


			//--------------------------------------------------------------------------
			// Public methods
			//--------------------------------------------------------------------------

			// Generate audio data for a single track
			this.generate = function () {
				// Local variables
				var i, j, b, p, row, col, n, cp,
					k, t, lfor, e, x, rsample, rowStartSample, f, da;

				// Put performance critical items in local variables
				var chnBuf = new Int32Array(mNumWords),
					instr = mSong.songData[mCurrentCol],
					rowLen = mSong.rowLen,
					patternLen = mSong.patternLen;

				// Clear effect state
				var low = 0, band = 0, high;
				var lsample, filterActive = false;

				// Clear note cache.
				var noteCache = [];

				// Patterns
				for (p = 0; p <= mLastRow; ++p) {
					cp = instr.p[p];

					// Pattern rows
					for (row = 0; row < patternLen; ++row) {
						// Execute effect command.
						var cmdNo = cp ? instr.c[cp - 1].f[row] : 0;
						if (cmdNo) {
							instr.i[cmdNo - 1] = instr.c[cp - 1].f[row + patternLen] || 0;

							// Clear the note cache since the instrument has changed.
							if (cmdNo < 17) {
								noteCache = [];
							}
						}

						// Put performance critical instrument properties in local variables
						var oscLFO = mOscillators[instr.i[16]],
							lfoAmt = instr.i[17] / 512,
							lfoFreq = (2 ** (instr.i[18] - 9)) / rowLen,
							fxLFO = instr.i[19],
							fxFilter = instr.i[20],
							fxFreq = instr.i[21] * 43.23529 * 3.141592 / 44100,
							q = 1 - instr.i[22] / 255,
							dist = instr.i[23] * 1e-5,
							drive = instr.i[24] / 32,
							panAmt = instr.i[25] / 512,
							panFreq = 6.283184 * (2 ** (instr.i[26] - 9)) / rowLen,
							dlyAmt = instr.i[27] / 255,
							dly = instr.i[28] * rowLen & ~1;  // Must be an even number

						// Calculate start sample number for this row in the pattern
						rowStartSample = (p * patternLen + row) * rowLen;

						// Generate notes for this pattern row
						for (col = 0; col < 4; ++col) {
							n = cp ? instr.c[cp - 1].n[row + col * patternLen] : 0;
							if (n) {
								if (!noteCache[n]) {
									noteCache[n] = createNote(instr, n, rowLen);
								}

								// Copy note from the note cache
								var noteBuf = noteCache[n];
								for (j = 0, i = rowStartSample * 2; j < noteBuf.length; j++, i += 2) {
									chnBuf[i] += noteBuf[j];
								}
							}
						}

						// Perform effects for this pattern row
						for (j = 0; j < rowLen; j++) {
							// Dry mono-sample
							k = (rowStartSample + j) * 2;
							rsample = chnBuf[k];

							// We only do effects if we have some sound input
							if (rsample || filterActive) {
								// State variable filter
								f = fxFreq;
								if (fxLFO) {
									f *= oscLFO(lfoFreq * k) * lfoAmt + 0.5;
								}
								f = 1.5 * Math.sin(f);
								low += f * band;
								high = q * (rsample - band) - low;
								band += f * high;
								rsample = fxFilter == 3 ? band : fxFilter == 1 ? high : low;

								// Distortion
								if (dist) {
									rsample *= dist;
									rsample = rsample < 1 ? rsample > -1 ? osc_sin(rsample * .25) : -1 : 1;
									rsample /= dist;
								}

								// Drive
								rsample *= drive;

								// Is the filter active (i.e. still audiable)?
								filterActive = rsample * rsample > 1e-5;

								// Panning
								t = Math.sin(panFreq * k) * panAmt + 0.5;
								lsample = rsample * (1 - t);
								rsample *= t;
							} else {
								lsample = 0;
							}

							// Delay is always done, since it does not need sound input
							if (k >= dly) {
								// Left channel = left + right[-p] * t
								lsample += chnBuf[k - dly + 1] * dlyAmt;

								// Right channel = right + left[-p] * t
								rsample += chnBuf[k - dly] * dlyAmt;
							}

							// Store in stereo channel buffer (needed for the delay effect)
							chnBuf[k] = lsample | 0;
							chnBuf[k + 1] = rsample | 0;

							// ...and add to stereo mix buffer
							mMixBuf[k] += lsample | 0;
							mMixBuf[k + 1] += rsample | 0;
						}
					}
				}

				// Next iteration. Return progress (1.0 == done!).
				mCurrentCol++;
				return mCurrentCol / mSong.numChannels;
			};

			// Create a AudioBuffer from the generated audio data
			this.createAudioBuffer = function (context) {
				var buffer = context.createBuffer(2, mNumWords / 2, 44100);
				for (var i = 0; i < 2; i++) {
					var data = buffer.getChannelData(i);
					for (var j = i; j < mNumWords; j += 2) {
						data[j >> 1] = mMixBuf[j] / 65536;
					}
				}
				return buffer;
			};

			// Create a WAVE formatted Uint8Array from the generated audio data
			this.createWave = function () {

				var headerLen = 44;
				var l1 = headerLen + mNumWords * 2 - 8;
				var l2 = l1 - 36;
				var wave = new Uint8Array(headerLen + mNumWords * 2);
				wave.set(
					[82, 73, 70, 70,
						l1 & 255, (l1 >> 8) & 255, (l1 >> 16) & 255, (l1 >> 24) & 255,
						87, 65, 86, 69, 102, 109, 116, 32, 16, 0, 0, 0, 1, 0, 2, 0,
						68, 172, 0, 0, 16, 177, 2, 0, 4, 0, 16, 0, 100, 97, 116, 97,
						l2 & 255, (l2 >> 8) & 255, (l2 >> 16) & 255, (l2 >> 24) & 255]
				);

				// Append actual wave data
				for (var i = 0, idx = headerLen; i < mNumWords; ++i) {
					// Note: We clamp here
					var y = mMixBuf[i];
					y = y < -32767 ? -32767 : (y > 32767 ? 32767 : y);
					wave[idx++] = y & 255;
					wave[idx++] = (y >> 8) & 255;
				}

				// Return the WAVE formatted typed array
				return wave;
			};

			// Get n samples of wave data at time t [s]. Wave data in range [-2,2].
			this.getData = function (t, n) {
				var i = 2 * Math.floor(t * 44100);
				var d = new Array(n);
				for (var j = 0; j < 2 * n; j += 1) {
					var k = i + j;
					d[j] = t > 0 && k < mMixBuf.length ? mMixBuf[k] / 32768 : 0;
				}
				return d;
			};
		};

		var song = {

					p: [1],
					c: [{ n: [152, , , , 156, , , , 161, , , , 159, , , , 152, , , , 156, , , , 161, , , , 159], f: [] }]
				},
				{ // Instrument 1
					i: [1, 51, 128, 64, 0, 53, 128, 0, 64, 60, 4, 7, 52, 85, 64, 0, 2, 60, 4, 1, 2, 255, 0, 0, 32, 61, 5, 32, 6],

		// -------------------------
		// AUDIO LOADING
		// -------------------------

		let musicDone = false;
		let bonusDone = false;
		let malusDone = false;
		let munchDone = false;

		let generateInterval = setInterval(function () {
			// Each track only generates while its own flag is still false
			if (!musicDone) { if (pMusic.generate() >= 1) musicDone = true; }
			if (!bonusDone) { if (pBonus.generate() >= 1) bonusDone = true; }
			if (!malusDone) { if (pMalus.generate() >= 1) malusDone = true; }
			if (!munchDone) { if (pMunch.generate() >= 1) munchDone = true; }

			// Once all 4 tracks are done, unlock the game
			if (musicDone && bonusDone && malusDone && munchDone) {

		// -------------------------
		// SFX PLAYER

		function playSfx(buffer) {
			if (!buffer || !audioCtx) return;
			if (audioCtx.state === "suspended") audioCtx.resume();

			let source = audioCtx.createBufferSource();
			source.buffer = buffer;

			let gainNode = audioCtx.createGain();

			gainNode.gain.value = 5.5;

			source.connect(gainNode);
			gainNode.connect(audioCtx.destination);

			source.start();
		}

		// -------------------------

		addEventListener("mousedown", (event) => {

				gameStats.isGameStarted = true;
				lastTime = performance.now();

				if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

				if (musicReady && musicAudio) {
					musicAudio.play();
				}
				return;
			}

			if (gameStats.isGameOver) {
				gameStats.score = 0;
				gameStats.combo = 0;
				gameStats.missed = 0;
				gameStats.rainbows = 0;
				gameStats.timeLeft = 60;
				gameStats.isGameOver = false;
				gameStats.level = 0;
				gameStats.poisonFlash = 0;
				gameStats.bonusFlash = 0;

				candies = [];
				particles = [];
				floatingTexts = [];

				box.state = "closed";
				box.stateTimer = 0;
				return;
			}

			if (event.button === 0) {
				unicorn.frame = 1;
			}
		});

		addEventListener("mouseup", (event) => {
			if (event.button === 0) {
				unicorn.frame = 0;
			}
		});

		addEventListener("mousemove", (event) => {
			unicorn.x = event.clientX;
			unicorn.y = event.clientY;
		});

		addEventListener("keydown", (event) => {
			if (!gameStats.isGameStarted) {
				gameStats.isGameStarted = true;
				lastTime = performance.now();

				if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

				// start the actual music
				if (musicReady && musicAudio) {
					musicAudio.play();
				}
			}
		});

		// -------------------------
		// EATEN CANDY PARTICLES EFFECTS
		// -------------------------

		function spawnParticles(x, y, type) {
			let colors = ["#FFFFFF", "#FFC0CB"]; // Normal
			if (type === "rainbow") colors = ["#FF0000", "#00FF00", "#0000FF", "#FFFF00"];
			if (type === "rotten") colors = ["#00FF00", "#005500", "#224422"];
			if (type === "clock") colors = ["#FFFF00", "#FFD700", "#FFFFFF"];

			for (let i = 0; i < 7; i++) {
				particles.push({
					x: x,
					y: y,
					vx: (Math.random() - 0.5) * 4,
					vy: (Math.random() - 0.5) * 4,
					life: 1.0,
					color: colors[Math.floor(Math.random() * colors.length)]
				});
			}
		}

		// -------------------------
		// FLOATING TEXTS
		// -------------------------

		function spawnFloatingText(x, y, text, color, size = 6) {
			floatingTexts.push({
				x: x,
				y: y,
				text: text,
				color: color,
				size: size,
				life: 1.0,
				vy: -1.5
			});
		}

		// -------------------------
		// UPDATE EFFECTS
		// -------------------------

		function updateEffects() {
			// update particles life
			particles = particles.filter(p => {
				p.x += p.vx;
				p.y += p.vy;
				p.life -= 0.01;
				return p.life > 0;
			});

			// update floating texts
			floatingTexts = floatingTexts.filter(t => {
				t.y += t.vy;
				t.life -= 0.015;
				return t.life > 0;
			});
		}

		// -------------------------
		// DRAW EFFECTS
		// -------------------------

		function drawEffects() {
			ctx.globalAlpha = 1.0;

			// draw particles
			particles.forEach(p => {
				ctx.fillStyle = p.color;
				ctx.fillRect(Math.round(p.x), Math.round(p.y), 6, 6);
			});

			// draw floating texts
			floatingTexts.forEach(t => {
				drawPixelText(t.text, Math.round(t.x), Math.round(t.y), t.size, t.color, "center");
			});
		}

		// -------------------------
		// LOOP
		// -------------------------

		let lastTime = 0;

		function loop(time) {
			if (lastTime === 0) lastTime = time;

			const deltaTime = time - lastTime;
			lastTime = time;

			update(deltaTime);
			draw();

			requestAnimationFrame(loop);
		}

		requestAnimationFrame(loop);
	</script>

</body>

</html>
