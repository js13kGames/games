<html> <head> <title>Gravity Golf - js13kGames 2015</title> <style>body{background-color:#151515;color:#fff;font-family:Lato,sans-serif;letter-spacing:4px}h1{font-weight:400}#container{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}</style> </head> <body> <div id="container"> <h1>Gravity Golf</h1> <div id="canvasContainer"></div> <p>dhmstark, js13k 2015</p> </div> <script>var game={interval:1e3/60,lastTime:0,planetCount:2};function setup(){document.getElementById("canvasContainer").innerHTML="",game.canvas=document.createElement("canvas"),game.canvas.id="canvas",game.canvas.width=1200,game.canvas.height=800,document.getElementById("canvasContainer").appendChild(game.canvas),game.ctx=game.canvas.getContext("2d"),document.getElementById("canvas").onmousedown=function(a){mousedown(a)},document.getElementById("canvas").onmouseup=function(a){mouseup(a)},document.getElementById("canvas").onmousemove=function(a){mousemove(a)},game.ctx.strokeStyle="white",initialiseData(),clear(),gameLoop()}function clear(){game.ctx.fillStyle="black",game.ctx.fillRect(0,0,game.canvas.width,game.canvas.height)}function initialiseData(){game.planets=[],game.planets.push(randomPlanet(!0));for(var a=0;a<game.planetCount;a++)game.planets.push(randomPlanet());game.ball=randomBall(),game.charging=!1,game.mag=.02,game.strokes=0}function Ball(a,t,e,i,n,s){this.x=a,this.y=t,this.dX=e,this.dY=i,this.radius=n,this.drawRadius=s,this.mass=1,this.grounded=!1,this.move=function(){var a=checkCollisions(this);if(a){var t=unitVector({x:this.x-a.x,y:this.y-a.y}),e=dotProduct({x:this.dX,y:this.dY},t);this.dX-=(1+a.elasticity)*e*t.x,this.dY-=(1+a.elasticity)*e*t.y,this.dX*=a.elasticity,this.dY*=a.elasticity;var i=getMagnitude({x:this.dX,y:this.dY});if(i<.5&&i>=.2?(this.dX*=.5,this.dY*=.5):i<.2&&(this.dX=0,this.dY=0,this.grounded=!0),this.grounded){var n=unitVector({x:this.x-a.x,y:this.y-a.y});this.x=a.x+n.x*(a.radius+6),this.y=a.y+n.y*(a.radius+6)}if(a.hole&&this===game.ball){var s=Math.atan2(this.y-a.y,this.x-a.x);s<=a.hole.position+a.hole.radius&&s>=a.hole.position-a.hole.radius&&(alert("You win! Strokes: "+game.strokes),game.planetCount++,setup())}}this.x+=this.dX,this.y+=this.dY},this.draw=function(){this.grounded?game.ctx.strokeStyle="yellow":game.ctx.strokeStyle="white",game.ctx.beginPath(),game.ctx.arc(this.x,this.y,this.drawRadius,0,2*Math.PI),game.ctx.stroke(),game.ctx.strokeStyle="white"}}function randomBall(){var a=new Ball(Math.random()*game.canvas.width,Math.random()*game.canvas.height,2*Math.random()-1,2*Math.random()-1,5,5);return checkCollisions(a)?randomBall():a}function Planet(a,t,e,i,n){this.x=a,this.y=t,this.mass=e,this.radius=i,this.elasticity=.75,this.hole=n,this.draw=function(){game.ctx.strokeStyle="white",game.ctx.beginPath(),game.ctx.arc(this.x,this.y,this.radius,0,2*Math.PI),game.ctx.stroke(),this.hole&&(game.ctx.strokeStyle="red",game.ctx.beginPath(),game.ctx.arc(this.x,this.y,this.radius,this.hole.position-this.hole.radius,this.hole.position+this.hole.radius),game.ctx.stroke())}}function randomPlanet(a){var t=500*Math.random()+500*Math.random()+500*Math.random(),e=t/15,i=(Math.random()+Math.random())/2*(game.canvas.width-2*e)+e,n=(Math.random()+Math.random())/2*(game.canvas.height-2*e)+e,s=!1;return a&&(s={position:(2*Math.random()-1)*Math.PI,radius:5/e}),checkCollisions(new Planet(i,n,t,e+12,s))?randomPlanet(a):new Planet(i,n,t,e,s)}function gameLoop(){window.requestAnimationFrame(gameLoop);var a=(new Date).getTime(),t=a-game.lastTime;if(t>game.interval){for(var e in clear(),game.ball.grounded||(gravityPull(game.ball),game.ball.move()),game.ball.draw(),game.planets)game.planets[e].draw();game.charging&&drawPath(game.ball),game.showingGrid&&displayGrid(),game.lastTime=a-t%game.interval}}function gravityPull(a){var t=0,e=0;for(var i in game.planets){var n=game.planets[i],s=getDist(a,n),o=a.mass*n.mass/Math.pow(s,2);t-=Math.sin((a.x-n.x)/s)*o,e-=Math.sin((a.y-n.y)/s)*o}a.dX+=t,a.dY+=e}function checkCollisions(a){for(var t in game.planets){var e=game.planets[t];if(getDist(a,e)<e.radius+a.radius)return e}return!1}function drawPath(a){var t=new Ball(a.x,a.y,a.dX,a.dY,5,1),e=unitVector({x:game.charging.x-game.ball.x,y:game.charging.y-game.ball.y}),i=getDist(game.charging,game.ball);t.dX+=e.x*i*game.mag,t.dY+=e.y*i*game.mag,t.grounded=!1;for(var n=0;n<400&&(gravityPull(t),t.move(),!t.grounded);n++)n%4==0&&t.draw()}function displayGrid(){for(var a=0,t=game.canvas.height/10;a<=t;a++)for(var e=0,i=game.canvas.width/10;e<=i;e++){var n={x:10*e,y:10*a,dX:0,dY:0,mass:1,radius:1};if(!checkCollisions(n)){gravityPull(n);var s=n.x+200*n.dX,o=n.y+200*n.dY;game.ctx.beginPath(),game.ctx.moveTo(s,o),game.ctx.lineTo(s+1,o+1),game.ctx.stroke()}}}function mousedown(a){game.ball.grounded&&(game.charging={x:a.offsetX,y:a.offsetY})}function mouseup(a){if(game.ball.grounded){var t=a.offsetX,e=a.offsetY,i=unitVector({x:t-game.ball.x,y:e-game.ball.y}),n=getDist(game.charging,game.ball);game.ball.dX+=i.x*n*game.mag,game.ball.dY+=i.y*n*game.mag,game.ball.grounded=!1,game.charging=!1,game.strokes++}}function mousemove(a){game.charging&&(game.charging={x:a.offsetX,y:a.offsetY})}function getDist(a,t){return Math.sqrt(Math.pow(a.x-t.x,2)+Math.pow(a.y-t.y,2))}function getMagnitude(a){return Math.sqrt(a.x*a.x+a.y*a.y)}function unitVector(a){return{x:a.x/getMagnitude(a),y:a.y/getMagnitude(a)}}function dotProduct(a,t){return a.x*t.x+a.y*t.y}setup()</script> </body> </html>
