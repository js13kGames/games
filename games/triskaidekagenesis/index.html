  }

  #T {

    position: fixed;
    left: 0;

  }

  #T:empty {

  }

  #t {

  }

  }

  }

    font-size: 1.5rem;
    width: 6rem;
    background: #fff;
  }

    animation: blink 0.5s infinite alternate, shake 0.03s infinite alternate;
    position: relative;
    display: inline-block;
  }

    color: red;
    transform: scale(1.2);
  }

  .scary .safe {
    filter: blur(2px);
  }

  .scary.final .safe {
    filter: none;
  }

  .scary h4 {
    animation: shake 0.03s infinite alternate;
  }


  .scary.final h4 {
    animation: none;
  }

  .variants {
    columns: 5;
  }


  .story,
  .variants {
    text-align: left;
    padding: 0.5rem;
  }

  .story,
  .variants,
  .round,
  .cards,
  #T,
  h4 {
    border: solid 0.2rem #8880;
    box-shadow: 0 0.1rem 0.25rem #0008;
    background: #fffc;
  }

  .story {
    max-width: 40rem;
    margin: auto;
  }

  .note {
    padding-top: 2rem;
  }


  button {
    margin-top: 0.5rem;
    margin-bottom: 1rem;
    border: solid 1px #000;
    box-shadow: 0 0.1rem 0.25rem #0008;
    animation: grow 0.5s infinite alternate;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0.5rem;
  }

  .variants:empty {
    border: none;
    box-shadow: none;
  }

  .card {
    display: inline-block;
    border-radius: 1rem;
    font-size: 5rem;
    margin: 1rem;
    padding: 1rem;
    cursor: pointer;
    border: solid 0.5px #0008;
    box-shadow: 0 0.1rem 0.1rem #0008;
    user-select: none;
    background: #fff;
  }

  .card:hover {
    transform: scale(1.1) translateY(-0.2rem);
    box-shadow: 0 0.2rem 0.2rem #0008;
  }

  .bottom {
    position: absolute;
    bottom: 0;
    width: 99%;
  }


  .cards {
    margin-top: 5rem;
  }

  .sel {
    transform: translateY(-3rem);
  }

  .card.sel:hover {
    transform: scale(1.1) translateY(-3.2rem);
  }

  @keyframes grow {
    to {
      transform: scale(1.03);
    }
  }

  @keyframes blink {
    to {
      color: #f00;
      transform: scale(1.2);
    }
  }

  @keyframes bodyrot {
    0%,100%{

    }

    }

    }
    30.2% {
      filter: blur(10px);
    }
  }


  @keyframes border1 {
    to {
      border-color: #f00;
    }
  }

    to {

    }
