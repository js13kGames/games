<!doctype html><title>Offline Race - js13kGames 2018</title><meta name="viewport" content="width=device-width,user-scalable=no"><style>body,html{width:100%;height:100vh;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background-color:#000}#game{height:100%;width:100%;background-color:#fff;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}.w{stroke-width:4;stroke:white}.b{stroke-width:3;stroke:black}</style><body><svg id="game"></svg><script>function loadScripts(fExt,fMod,start){let cont=0;const fLoaded=f=>{cont++,cont==fExt.length+fMod.length&&start()};fExt.forEach(function(f){new Promise((resolve,reject)=>{loadScript(f,resolve)}).then(success=>fLoaded())}),fMod.forEach(function(f){new Promise((resolve,reject)=>{loadScript(`/model/${f}.js`,resolve)}).then(success=>fLoaded())})}function loadScript(f,resolve){let h=document.getElementsByTagName("head")[0],s=document.createElement("script");s.type="text/javascript",s.onload=()=>resolve(f),s.src=f,h.appendChild(s)}function createSVG(el){return document.createElementNS("http://www.w3.org/2000/svg",el)}function addStyle(stl){document.styleSheets[0].insertRule(stl)}Element.prototype.set=function(props){props.forEach(p=>this.setAttribute(p[0],p[1]))}</script><script>loadScripts(["/socket.io.js","client.js"],[],()=>{G=new Game})</script></body>
