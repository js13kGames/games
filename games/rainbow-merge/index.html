<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9e8f2"><title>Rainbow Merge</title><style>:root { --ink: #59465f; --muted: #88728b; --rose: #ba477d; --rainbow: linear-gradient(90deg, #f16b87, #ffa25e, #f6d15a, #70ce9c, #60d2df, #719ded, #b28ae0); font-family: 'Trebuchet MS', 'Verdana', sans-serif; color: var(--ink); } * { box-sizing: border-box; margin: 0; padding: 0; letter-spacing: 0; -webkit-tap-highlight-color: transparent; } body { min-height: 100svh; display: grid; place-items: center; padding: 28px 20px 20px; background: linear-gradient(125deg, #fbe3ec 0%, #f6eafa 43%, #e2f2fb 77%, #e8f5f4 100%); } #sky, #celebration { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; } #sky { z-index: -1; } #wrap { width: 100%; max-width: 448px; animation: arrive 0.7s ease-out both; } #hd { display: flex; align-items: center; justify-content: space-between; min-height: 112px; gap: 8px; margin-bottom: 16px; } .eyebrow { font-size: 9px; font-weight: 700; color: var(--muted); margin-bottom: 9px; } h1 { font-size: 38px; line-height: 1.07; font-weight: 900; display: block; background-image: var(--rainbow); color: transparent; background-clip: text; -webkit-background-clip: text; } #mascot { position: relative; /* width: 138px; flex: 0 0 138px; */ text-align: center; } #goal-art { display: block; width: 124px; height: 124px; margin: -14px auto -4px; filter: drop-shadow(0 5px 4px #c29bd32a); } #mascot span { font-size: 8px; font-weight: 700; color: #9674a4; } #toolbar { display: flex; align-items: center; justify-content: space-between; margin: 0 0 15px; } #scores { display: flex; gap: 26px; } .sc { min-width: 66px; } .sc + .sc { border-left: 1px solid #c8afd455; padding-left: 25px; } .sc span { display: block; font-size: 9px; font-weight: 700; color: var(--muted); margin-bottom: 3px; } .sc b { font-size: 25px; font-variant-numeric: tabular-nums; line-height: 1.1; } button { font: 700 13px 'Trebuchet MS', 'Verdana', sans-serif; cursor: pointer; border: 1px solid #fff9; border-radius: 8px; padding: 12px 18px; color: #fff; background: #b45b93; box-shadow: 0 3px 0 #934474, 0 6px 12px #af79a52b; transition: background 0.15s, transform 0.15s; } button:hover { background: #a54b85; transform: translateY(-1px); } button:active { transform: translateY(2px); box-shadow: none; } button:focus-visible, a:focus-visible, #canvas:focus-visible { outline: 3px solid #a04b90; outline-offset: 5px; } .reset { width: 44px; height: 44px; padding: 0; background: #fffcffb3; color: #947caa; border: 1px solid #fff; box-shadow: 0 3px 0 #dbcbe6, 0 5px 10px #a885bb12; } .reset span { display: block; font-family: 'Segoe UI Symbol', sans-serif; font-size: 29px; line-height: 36px; } .reset:hover { background: #fff; } #board-shell { position: relative; border-radius: 26px; padding: 9px; background: linear-gradient(145deg, #fffdfd, #f5dff1 50%, #d7e7f7); border: 2px solid #fffcff; box-shadow: 0 7px 0 #c7b9db, 0 12px 0 #ffffff70, 0 23px 45px #9d80b52b; } #canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; border-radius: 17px; touch-action: none; } #combo { position: absolute; left: 8px; right: 8px; top: 38%; text-align: center; pointer-events: none; font-size: 23px; font-weight: 900; color: #9d3779; text-shadow: 0 2px #fff, 2px 0 #fff, -2px 0 #fff, 0 -2px #fff, 0 4px 12px #fff; opacity: 0; } #combo.active { animation: combo 1.25s ease-out both; } #combo.rainbow { color: #7953ab; } #journey { margin-top: 29px; } #journey-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0 3px 15px; } h2 { font-size: 15px; font-weight: 700; } #current-color { font-size: 11px; font-weight: 700; color: var(--rose); } #current-color small { margin-left: 7px; color: var(--muted); font-size: 10px; font-weight: 400; } #legend { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); list-style: none; position: relative; } #legend::before { content: ''; position: absolute; height: 3px; top: 20px; left: 16px; right: 16px; background: var(--rainbow); opacity: 0.25; } .lg { position: relative; min-width: 0; text-align: center; color: #806d89; font-size: 9px; } .lg canvas { position: relative; display: block; width: 38px; height: 38px; max-width: 100%; margin: 0 auto 8px; filter: saturate(0.65); opacity: 0.6; } .lg.reached canvas, .lg:last-child canvas { filter: none; opacity: 1; } .lg.current { color: #9d3779; font-weight: 700; } .lg.current::before { content: ''; position: absolute; top: -4px; left: 50%; transform: translateX(-50%); width: 44px; height: 45px; border-radius: 13px; border: 1.5px solid #b879ab; background: #fffcff70; box-shadow: 0 0 0 3px #fff6; } .lg.current::after { content: ''; display: block; width: 4px; height: 4px; border-radius: 50%; margin: 5px auto 0; background: #b15a93; } #footer { display: flex; justify-content: space-between; gap: 8px; margin: 23px 3px 0; border-top: 1px solid #ac8cbe20; padding-top: 14px; color: var(--muted); font-size: 9px; } #footer a { color: #80658e; text-decoration: none; } #footer a:hover { text-decoration: underline; } #celebration { z-index: 12; } #overlay { position: fixed; inset: 0; background: #57416245; backdrop-filter: blur(7px); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 20px; } #overlay.hidden { display: none; } #ov-card { width: 100%; max-width: 370px; max-height: calc(100svh - 40px); overflow: auto; padding: 20px 25px 29px; text-align: center; border: 2px solid white; border-radius: 24px; background: linear-gradient(145deg, #fffafb, #f2edff 65%, #e9f7fa); box-shadow: 0 9px 0 #d4c1df80, 0 20px 70px #654c8250; animation: arrive 0.45s ease-out both; } #win-art { width: 210px; height: 168px; max-width: 100%; display: block; margin: -2px auto 8px; } .won #win-art { animation: unicorn-dance 2.4s ease-in-out infinite; } #ov-kicker { font-size: 9px; color: #ad6797; font-weight: 700; margin-bottom: 10px; } #ov-msg { font-size: 27px; line-height: 1.15; margin-bottom: 12px; color: #8b4e8e; } #ov-sub { font-size: 13px; line-height: 1.6; margin-bottom: 23px; color: var(--muted); } #ov-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; } #ov-new { background: #fff9; color: #866695; box-shadow: 0 3px 0 #dbcae5; } .hidden { display: none; } @keyframes arrive { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } } @keyframes combo { 0% { opacity: 0; transform: translateY(15px) scale(0.7); } 16%, 60% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-35px); } } @keyframes unicorn-dance { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } } @media (max-width: 380px) { body { padding: 18px 15px; } #hd { min-height: 94px; margin-bottom: 10px; } h1 { font-size: 32px; } #mascot { width: 106px; flex-basis: 106px; } #goal-art { width: 106px; height: 106px; } .lg { font-size: 8px; } .lg canvas { width: 30px; height: 30px; } .lg.current::before { width: 33px; height: 37px; border-radius: 10px; } #legend::before { top: 16px; } #board-shell { padding: 6px; border-radius: 22px; } #journey-heading { margin-bottom: 12px; } #journey { margin-top: 25px; } #footer { margin-top: 17px; font-size: 8px; } } @media (max-height: 760px) and (min-width: 600px) { body { padding-top: 14px; } #wrap { max-width: 370px; } #hd { min-height: 86px; margin-bottom: 6px; } #goal-art { width: 96px; height: 96px; } h1 { font-size: 38px; } #footer { margin-top: 15px; } } @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; } #combo.active { animation: none !important; opacity: 1; } } </style></head><body><canvas id="sky" aria-hidden="true"></canvas><main id="wrap"><header id="hd"><div id="brand"><h1>Rainbow&nbsp;Merge</h1></div><div id="mascot"><canvas id="goal-art" width="240" height="240" aria-label="A unicorn under a rainbow" role="img"></canvas></div></header><div id="toolbar"><div id="scores"><div class="sc"><span>SCORE</span><b id="score">0</b></div><div class="sc"><span>PERSONAL BEST</span><b id="best">0</b></div></div><button id="new" class="reset" title="New game" aria-label="New game"><span aria-hidden="true">&#8635;</span></button></div><div id="board-shell"><canvas id="canvas" tabindex="0" aria-label="Rainbow Merge, 4 by 4 puzzle. Use arrow keys, WASD, or swipe to merge matching gems."></canvas><div id="combo" role="status" aria-live="polite"></div></div><section id="journey" aria-labelledby="journey-title"><div id="journey-heading"><span id="current-color" aria-live="polite">Red <small>1 / 9</small></span></div><ol id="legend"></ol></section></main><canvas id="celebration" aria-hidden="true"></canvas><div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="ov-msg" aria-describedby="ov-sub" inert><div id="ov-card"><canvas id="win-art" width="400" height="320" role="img" aria-label="A happy unicorn and its rainbow"></canvas><h2 id="ov-msg"></h2><div id="ov-sub"></div><div id="ov-btns"><button id="ov-keep" class="hidden">Keep Going</button><button id="ov-new">New Game</button></div></div></div><script src="b.js"></script></body></html>
