<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Rainbow Qix - js13k</title>
    <style>
        body { margin: 0; background: #111; display: flex; flex-direction: column; align-contents: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #fff; overflow: hidden; }
        canvas { background: #222; box-shadow: 0 0 20px #000; margin: auto; width:min(96vw,900px) }
        #info { text-align: center; margin-bottom: 5px; text-shadow: 1px 1px 2px #000; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Endless Rainbow Qix</h2>
        <p>Move with WASD / Arrow keys. <strong>Hold SPACE</strong> to leave a trail and claim territory!</p>
        <p>Level: <span id="level">1</span> | Covered: <span id="pct">0</span>% | Goal: <span id="target">55</span>% | Lives: <span id="lives">3</span> | Enemies: <span id="enemies">0</span></p>
    </div>
    <canvas id="c" width="600" height="450"></canvas>

<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const pctEl = document.getElementById('pct'), targetEl = document.getElementById('target'), livesEl = document.getElementById('lives'), enemiesEl = document.getElementById('enemies'), levelEl = document.getElementById('level'), infoEl = document.getElementById('info');

const ROWS = 45, COLS = 60, CELL = 10;
// Matrice della griglia: 0 = Grigio (Vuoto), 1 = Sicuro (Bordo/Colorato), 2 = Scia in corso
let grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));

// Crea la cornice iniziale sicura (i bordi esterni dello schermo)
for(let r=0; r<ROWS; r++) { grid[r][0] = 1; grid[r][COLS-1] = 1; }
for(let c=0; c<COLS; c++) { grid[0][c] = 1; grid[ROWS-1][c] = 1; }

let player = { r: 0, c: 0, drawing: false, turns: 0, slow: false, rainbow: 0, dr: 0, dc: 1, lastDr: 0, lastDc: 0 };
let level = 0, lives = 3, pct = 0, target = 55, seed = 0, enemies = [], shots = [], playerShots = [], gems = [], effects = [], notice = '', noticeTime = 0, fade = 0, fadeWait = 45, started = false, blink = 0, audio;

function showNotice(text) { notice = text; noticeTime = 90; }
function burst(x, y, color) { effects.push({x, y, color, time: 1}); }
function sound(type) {
    if(!audio) audio = new AudioContext();
    let n = audio.createOscillator(), g = audio.createGain(), f = {move:220, enemy:90, hit:55, kill:520, gem:700, fire:360}[type] || 220;
    n.frequency.value = f; n.type = type === 'fire' || type === 'gem' ? 'sine' : 'square'; g.gain.value = .035; n.connect(g); g.connect(audio.destination); n.start(); n.stop(audio.currentTime + (type === 'kill' ? .14 : .06));
}
function collectGem(gem) {
    if(gem.type) { player.rainbow = 300; showNotice('Rainbow gem: rainbow fire!'); }
    else { player.slow = true; showNotice('Blue gem: slow movement!'); }
    sound('gem');
    burst(gem.c * CELL + 5, gem.r * CELL + 5, gem.type ? '#ffd84d' : '#54e8ff');
}

function makeImage() {
    seed = (Math.random() * 360) | 0;
    return Array.from({length: ROWS * COLS}, (_, i) => {
        let x = i % COLS, y = (i / COLS) | 0;
        return (Math.sin(x * .27 + seed) + Math.cos(y * .31 - seed) + Math.sin((x + y) * .12)) * .5 + .5;
    });
}
let image = makeImage()

function newLevel() {
    level++;
    levelEl.innerText = level;
    target = Math.min(90, 50 + level * 5);
    targetEl.innerText = target;
    image = makeImage();
    grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
    for(let r=0; r<ROWS; r++) { grid[r][0] = 1; grid[r][COLS-1] = 1; }
    for(let c=0; c<COLS; c++) { grid[0][c] = 1; grid[ROWS-1][c] = 1; }
    player.r = 0; player.c = 0; player.drawing = false; player.turns = 0; player.lastDr = 0; player.lastDc = 0;
    player.slow = false; player.rainbow = 0; player.dr = 0; player.dc = 1;
    enemies = Array.from({length: Math.min(1 + level, 8)}, (_, i) => {
        let angle = .65 + i * 1.7, speed = 1.25 + level * .28;
        return {x: 100 + i * 53, y: 120 + (i % 3) * 80, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, fire: 50 + i * 20};
    });
    enemiesEl.innerText = enemies.length;
    shots = [];
    playerShots = [];
    gems = Array.from({length: Math.min(3 + level, 10)}, (_, i) => ({r: 3 + (i * 7 + level * 3) % (ROWS - 6), c: 4 + (i * 13 + level * 5) % (COLS - 8), type: i % 2}));
    pct = 0;
    pctEl.innerText = 0;
}
newLevel();

// Input
let keys = {};
window.onkeydown = e => { if(e.key === ' ' && !started) { started = true; infoEl.style.display = ''; if(audio) audio.resume(); else sound('gem'); } keys[e.key.toLowerCase()] = true; if(e.key === ' ') e.preventDefault(); };
window.onkeyup = e => keys[e.key.toLowerCase()] = false;
window.onresize = () => document.location.reload();

function startScreen() {
    ctx.fillStyle = '#101018'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    for(let i = 0; i < 5; i++) for(let j = 0; j < 7; j++) {
        ctx.strokeStyle = `hsl(${j * 50},90%,60%)`; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.arc(65 + i * 120, 270, 72 + j * 8, Math.PI, 0); ctx.stroke();
    }
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#54e8ff'; ctx.fillText('◆  SLOW GEM: SLOWS YOU', 180, 320);
    ctx.fillStyle = '#ffd84d'; ctx.fillText('◆  RAINBOW GEM: RAINBOW FIRE', 420, 320);
    if((blink++ >> 4) % 2) { ctx.fillStyle = '#ffd84d'; ctx.font = 'bold 22px sans-serif'; ctx.fillText('PRESS SPACE TO START', canvas.width / 2, 385); }
}

// Algoritmo Flood Fill (Riempimento di colore ricorsivo/iterativo)
function floodFill(startR, startC) {
    let queue = [[startR, startC]], filled = [];
    let visited = Array(ROWS).fill().map(() => Array(COLS).fill(false));
    let touchesShadow = false;

    while(queue.length > 0) {
        let [r, c] = queue.shift();
        if(r < 0 || r >= ROWS || c < 0 || c >= COLS || visited[r][c] || grid[r][c] !== 0) continue;
        visited[r][c] = true;
        filled.push([r, c]);

        enemies.forEach(enemy => {
            if(r === Math.floor(enemy.y / CELL) && c === Math.floor(enemy.x / CELL)) touchesShadow = true;
        });

        queue.push([r+1, c], [r-1, c], [r, c+1], [r, c-1]);
    }
    return { filled, touchesShadow };
}

function processConquest() {
    // Quando chiudiamo una forma, cerchiamo tutte le aree grigie rimaste
    let segments = [], oldSafe = 0;
    let visitedGlobal = Array(ROWS).fill().map(() => Array(COLS).fill(false));

    for(let r=1; r<ROWS-1; r++) {
        for(let c=1; c<COLS-1; c++) {
            if(grid[r][c] === 1) oldSafe++;
            if(grid[r][c] === 0 && !visitedGlobal[r][c]) {
                let res = floodFill(r, c);
                res.filled.forEach(([fr, fc]) => visitedGlobal[fr][fc] = true);
                segments.push(res);
            }
        }
    }
    // Trasforma la scia arcobaleno (2) in zona sicura colorata (1)
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS; c++) { if(grid[r][c] === 2) grid[r][c] = 1; }
    }
    let clearSegments = segments.filter(seg => !seg.touchesShadow);
    if(clearSegments.length > 1) {
        clearSegments = [clearSegments.reduce((smallest, seg) => seg.filled.length < smallest.filled.length ? seg : smallest)];
    }
    if(!clearSegments.length && segments.length) {
        clearSegments = [segments.reduce((smallest, seg) => seg.filled.length < smallest.filled.length ? seg : smallest)];
    }
    clearSegments.forEach(seg => seg.filled.forEach(([fr, fc]) => grid[fr][fc] = 1));
    gems = gems.filter(gem => {
        if(grid[gem.r][gem.c] === 1) { collectGem(gem); return false; }
        return true;
    });
    enemies = enemies.filter(enemy => {
        let r = Math.min(ROWS - 1, Math.max(0, Math.floor(enemy.y / CELL)));
        let c = Math.min(COLS - 1, Math.max(0, Math.floor(enemy.x / CELL)));
        if(grid[r][c] === 1) { burst(enemy.x, enemy.y, '#fff'); sound('kill'); return false; }
        return grid[r][c] !== 1;
    });
    enemiesEl.innerText = enemies.length;
    // Ricalcola percentuale
    let safeCount = 0;
    for(let r=1; r<ROWS-1; r++) { for(let c=1; c<COLS-1; c++) { if(grid[r][c] === 1) safeCount++; } }
    pct = Math.floor((safeCount / ((ROWS - 2) * (COLS - 2))) * 100);
    pctEl.innerText = pct;
    let gained = Math.floor((safeCount - oldSafe) * 100 / ((ROWS - 2) * (COLS - 2)));
    showNotice(pct >= target ? 'Goal reached! ' + pct + '%' : '+' + gained + '% claimed | total ' + pct + '%');
    
    if(pct >= target) {
        if(level >= 8) { alert('The rainbow is safe!'); document.location.reload(); }
        else {
            newLevel();
            showNotice('Level ' + level + ' | claim ' + target + '% | lives: ' + lives);
        }
    }
}

function resetTrail() {
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS; c++) { if(grid[r][c] === 2) grid[r][c] = 0; }
    }
    player.r = 0; player.c = 0; // Rimanda il giocatore all'angolo sicuro
    player.drawing = false; player.turns = 0; player.lastDr = 0; player.lastDc = 0;
    player.slow = false; player.rainbow = 0; playerShots = [];
}

function cancelTrail() {
    for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++) if(grid[r][c] === 2) grid[r][c] = 0;
    player.drawing = false; player.turns = 0; player.lastDr = 0; player.lastDc = 0;
    showNotice('Draw an area, not a line');
}

function safeEdge(r, c) {
    return r === 0 || c === 0 || r === ROWS - 1 || c === COLS - 1 || grid[r - 1][c] !== 1 || grid[r + 1][c] !== 1 || grid[r][c - 1] !== 1 || grid[r][c + 1] !== 1;
}

let moveCooldown = 0;
function loop() {
    if(!started) { startScreen(); requestAnimationFrame(loop); return; }
    enemies.forEach(enemy => {
        let sr = Math.min(ROWS - 1, Math.max(0, Math.floor(enemy.y / CELL)));
        let sc = Math.min(COLS - 1, Math.max(0, Math.floor(enemy.x / CELL)));
        let nextR = Math.min(ROWS - 1, Math.max(0, Math.floor((enemy.y + enemy.vy) / CELL)));
        let nextC = Math.min(COLS - 1, Math.max(0, Math.floor((enemy.x + enemy.vx) / CELL)));
        let hitY = nextR <= 0 || nextR >= ROWS - 1 || grid[nextR][sc] === 1;
        let hitX = nextC <= 0 || nextC >= COLS - 1 || grid[sr][nextC] === 1;
        if(hitY) enemy.vy *= -1;
        if(hitX) enemy.vx *= -1;
        if(grid[nextR][nextC] === 1 && !hitY && !hitX) {
            if(Math.abs(enemy.vx) > Math.abs(enemy.vy)) enemy.vx *= -1;
            else enemy.vy *= -1;
        }
        enemy.x += enemy.vx; enemy.y += enemy.vy;
        sr = Math.min(ROWS-1, Math.max(0, Math.floor(enemy.y / CELL)));
        sc = Math.min(COLS-1, Math.max(0, Math.floor(enemy.x / CELL)));
        sr = Math.min(ROWS-1, Math.max(0, Math.floor(enemy.y / CELL)));
        sc = Math.min(COLS-1, Math.max(0, Math.floor(enemy.x / CELL)));
        if(grid[sr][sc] === 2) {
            burst(enemy.x, enemy.y, '#ff70c8');
            sound('hit');
            lives--; livesEl.innerText = lives;
            if(lives <= 0) { alert('The gloom overwhelmed the unicorn. Game Over!'); document.location.reload(); }
            else resetTrail();
        }
        if(--enemy.fire <= 0) {
            let length = Math.hypot(enemy.vx, enemy.vy);
            sound('enemy');
            shots.push({x: enemy.x, y: enemy.y, vx: enemy.vx / length * 2.8, vy: enemy.vy / length * 2.8});
            enemy.fire = Math.max(28, 75 - level * 5);
        }
    });

    shots = shots.filter(shot => {
        shot.x += shot.vx; shot.y += shot.vy;
        if(grid[player.r][player.c] !== 1 && Math.hypot(shot.x - (player.c * CELL + 5), shot.y - (player.r * CELL + 5)) < 7) {
            burst(player.c * CELL + 5, player.r * CELL + 5, '#ff70c8');
            sound('hit');
            lives--; livesEl.innerText = lives;
            if(lives <= 0) { alert('The gloom overwhelmed the unicorn. Game Over!'); document.location.reload(); }
            else resetTrail();
            return false;
        }
        return shot.x > 0 && shot.x < canvas.width && shot.y > 0 && shot.y < canvas.height;
    });

    // Movimento Giocatore a griglia sincrona
    if(moveCooldown <= 0) {
        let dr = 0, dc = 0;
        if (keys['w'] || keys['arrowup']) dr = -1;
        else if (keys['s'] || keys['arrowdown']) dr = 1;
        else if (keys['a'] || keys['arrowleft']) dc = -1;
        else if (keys['d'] || keys['arrowright']) dc = 1;

        if(dr !== 0 || dc !== 0) {
            player.dr = dr; player.dc = dc;
            let nr = player.r + dr, nc = player.c + dc;
            if(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                let targetCell = grid[nr][nc];
                let isSpacePressed = keys[' '];

                if(targetCell === 1 && safeEdge(nr, nc)) { // Si muove sul bordo sicuro
                    if(player.drawing) { // Stava disegnando e ha appena chiuso il recinto!
                        if(player.turns) processConquest(); else cancelTrail();
                        player.drawing = false;
                    }
                    player.r = nr; player.c = nc;
                    sound('move');
                } 
                else if(targetCell === 0 && isSpacePressed) { // Entra nel vuoto grigio lasciando la scia
                    player.drawing = true;
                    if(player.lastDr && (player.lastDr !== dr || player.lastDc !== dc)) player.turns++;
                    player.lastDr = dr; player.lastDc = dc;
                    grid[nr][nc] = 2; // Lascia scia
                    player.r = nr; player.c = nc;
                    sound('move');
                }
                gems = gems.filter(gem => gem.r !== nr || gem.c !== nc || (collectGem(gem), false));
                enemiesEl.innerText = enemies.length;
                moveCooldown = player.slow ? 8 : 4;
            }
        }
    } else { moveCooldown--; }
    if(player.rainbow > 0) {
        player.rainbow--;
        if(player.rainbow % 12 === 0) { sound('fire'); playerShots.push({x: player.c * CELL + 5, y: player.r * CELL + 5, vx: player.dc * 4, vy: player.dr * 4}); }
    }
    playerShots = playerShots.filter(shot => {
        shot.x += shot.vx; shot.y += shot.vy;
        let hit = enemies.findIndex(enemy => Math.hypot(shot.x - enemy.x, shot.y - enemy.y) < 10);
        if(hit >= 0) { burst(enemies[hit].x, enemies[hit].y, '#ffd84d'); sound('kill'); enemies.splice(hit, 1); enemiesEl.innerText = enemies.length; return false; }
        return shot.x > 0 && shot.x < canvas.width && shot.y > 0 && shot.y < canvas.height;
    });

    // RENDERING
    ctx.clearRect(0,0, canvas.width, canvas.height);

    // Disegna la griglia di gioco
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS; c++) {
            if(grid[r][c] === 1) {
                // Territorio sicuro / Purificato (Prato colorato generato via HSL)
                ctx.fillStyle = `hsl(${(image[r*COLS+c]*360+level*20)%360}, 80%, 55%)`; 
                ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
            } else if(grid[r][c] === 2) {
                // Scia Arcobaleno attiva
                ctx.fillStyle = `hsl(${(c*20)%360}, 100%, 60%)`;
                ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
            } else {
                // Mondo Grigio / Apocalittico
                let gray = 22 + (image[r*COLS+c] * 24 | 0);
                ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
                ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
            }
        }
    }

    gems.forEach(gem => {
        let x = gem.c * CELL + 5, y = gem.r * CELL + 5;
        ctx.fillStyle = gem.type ? '#ffd84d' : '#54e8ff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 7); ctx.lineTo(x - 6, y); ctx.closePath(); ctx.fill(); ctx.stroke();
    });

    // Disegna l'Unicorno (Giocatore)
    effects = effects.filter(effect => {
        effect.time -= .08;
        ctx.globalAlpha = effect.time;
        ctx.strokeStyle = effect.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(effect.x, effect.y, 4 + (1 - effect.time) * 18, 0, 7); ctx.stroke();
        ctx.globalAlpha = 1;
        return effect.time > 0;
    });
    // Disegna l'Unicorno (Giocatore)
    let px = player.c*CELL + 5, py = player.r*CELL + 5;
    ctx.save();
    ctx.translate(px, py);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#e85d9e'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 2, 5, 4, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-3, -1); ctx.lineTo(-5, -7); ctx.lineTo(-1, -3); ctx.lineTo(3, -7); ctx.lineTo(3, -1); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd84d'; ctx.beginPath(); ctx.moveTo(1, -4); ctx.lineTo(3, -11); ctx.lineTo(5, -4); ctx.fill();
    ctx.restore();

    shots.forEach(shot => {
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(shot.x, shot.y, 2, 0, 7); ctx.fill();
    });
    playerShots.forEach(shot => {
        ctx.fillStyle = `hsl(${(blink++ * 30) % 360},100%,60%)`; ctx.beginPath(); ctx.arc(shot.x, shot.y, 3, 0, 7); ctx.fill();
    });

    enemies.forEach(enemy => {
        ctx.save(); ctx.translate(enemy.x, enemy.y); ctx.fillStyle = '#151515'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(-5, 3, 4, Math.PI, 0); ctx.arc(0, 0, 6, Math.PI, 0); ctx.arc(6, 3, 4, Math.PI, 0); ctx.lineTo(10, 7); ctx.lineTo(-9, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#777'; ctx.beginPath(); ctx.arc(-2, 3, 1, 0, 7); ctx.arc(4, 3, 1, 0, 7); ctx.fill();
        ctx.restore();
    });

    if(fadeWait) fadeWait--; else fade = Math.min(1, fade + .04);
    ctx.fillStyle = `rgba(0,0,0,${1 - fade})`; ctx.fillRect(0, 0, canvas.width, canvas.height);
    if(noticeTime > 0) {
        ctx.globalAlpha = Math.min(1, noticeTime / 20); ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(notice, canvas.width / 2, canvas.height / 2); ctx.globalAlpha = 1; noticeTime--;
    }

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
