<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rainbow Unicorn Blaster</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0b2e;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;font-family:sans-serif;text-shadow:0 2px 6px rgba(0,0,0,.7)}
#score{position:absolute;top:16px;left:20px;font-size:26px;font-weight:bold}
#best{position:absolute;top:46px;left:20px;font-size:13px;opacity:.65}
#lives{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:22px;letter-spacing:6px}
#colors{position:absolute;top:18px;right:20px;display:flex;gap:6px}
.cc{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.3);opacity:.2;transition:all .25s}
.cc.on{opacity:1;border-color:#fff;box-shadow:0 0 12px currentColor;transform:scale(1.2)}
.hide{display:none!important}

/* 游戏内封面层 */
#coverScreen{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:#0d0b2e;
    cursor:pointer;
}
#coverCanvas{
    max-width:100%;max-height:100%;
}
</style>
</head>
<body>

<!-- 内嵌封面：Canvas绘制，无外部图片 -->
<div id="coverScreen">
    <canvas id="coverCanvas" width="800" height="500"></canvas>
</div>

<canvas id="c"></canvas>
<div id="ui">
  <div id="score">0</div>
  <div id="best"></div>
  <div id="lives"></div>
  <div id="colors"></div>
</div>

<script>
// ========== 第一步：绘制封面 ==========
(function drawCover(){
    var cv = document.getElementById('coverCanvas');
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    var RB = ['#ff4477','#ff9944','#ffee44','#44dd77','#44ddee','#5577ff','#bb55ff'];

    // 天空渐变
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#89c8ff');
    g.addColorStop(1,'#ffd6ef');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // 彩虹
    for(var i=0;i<7;i++){
        ctx.beginPath();
        ctx.strokeStyle = RB[i];
        ctx.lineWidth = 14;
        ctx.arc(W/2, H+130, 330 - i*16, Math.PI, 0);
        ctx.stroke();
    }

    // 白云
    function cloud(x,y,s){
        ctx.fillStyle='#fff';
        ctx.beginPath();
        ctx.arc(x,y,s,0,Math.PI*2);
        ctx.arc(x+s*0.8,y-s*0.3,s*0.75,0,Math.PI*2);
        ctx.arc(x-s*0.8,y-s*0.2,s*0.7,0,Math.PI*2);
        ctx.fill();
    }
    cloud(130,120,44);
    cloud(670,100,50);
    cloud(730,390,38);
    cloud(90,430,35);

    // 乌云敌人
    function darkCloud(x,y,s){
        ctx.fillStyle='#3a3347';
        ctx.beginPath();
        ctx.arc(x,y,s,0,Math.PI*2);
        ctx.arc(x+s*0.7,y-s*0.25,s*0.65,0,Math.PI*2);
        ctx.arc(x-s*0.65,y-s*0.2,s*0.6,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#ff3344';
        ctx.beginPath();
        ctx.arc(x-s*0.22,y-8,5,0,Math.PI*2);
        ctx.arc(x+s*0.22,y-8,5,0,Math.PI*2);
        ctx.fill();
    }
    darkCloud(150,350,40);
    darkCloud(630,230,36);
    darkCloud(230,190,32);
    darkCloud(570,370,38);

    // 独角兽
    ctx.save();
    ctx.translate(W/2, 330);
    ctx.fillStyle='#fff8fc';
    ctx.beginPath();
    ctx.ellipse(0,20,48,34,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(40,-10,28,24,0.2,0,Math.PI*2); ctx.fill();
    // 金角
    ctx.fillStyle='#ffdd33';
    ctx.beginPath();
    ctx.moveTo(44,-30); ctx.lineTo(54,-68); ctx.lineTo(62,-32);
    ctx.closePath(); ctx.fill();
    // 鬃毛
    ctx.fillStyle='#ff77bb';
    ctx.beginPath(); ctx.arc(24,-26,15,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10,-16,13,0,Math.PI*2); ctx.fill();
    // 眼睛
    ctx.fillStyle='#222';
    ctx.beginPath(); ctx.arc(50,-12,4.5,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // 标题
    ctx.font = 'bold 52px Arial Black';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 5;
    ctx.strokeText('Rainbow Unicorn Blaster', W/2, 75);
    var tg = ctx.createLinearGradient(0,40,0,90);
    tg.addColorStop(0,'#ff4477');
    tg.addColorStop(0.5,'#ffee44');
    tg.addColorStop(1,'#5577ff');
    ctx.fillStyle = tg;
    ctx.fillText('Rainbow Unicorn Blaster', W/2, 75);

    // 闪烁提示
    ctx.font = '20px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.8;
    ctx.fillText('Click or press SPACE to start', W/2, 450);
})();

// ========== 封面交互：点击/空格进入游戏 ==========
var cover = document.getElementById('coverScreen');
function startGame(){
    cover.classList.add('hide');
    initGame();
}
cover.addEventListener('click', startGame);
addEventListener('keydown', function(e){
    if(e.code === 'Space' && !cover.classList.contains('hide')){
        e.preventDefault();
        startGame();
    }
});

// ========== 原有游戏完整逻辑 ==========
function initGame(){
var C=document.getElementById("c"),ctx=C.getContext("2d");
var scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),livesEl=document.getElementById("lives"),colEl=document.getElementById("colors");
var W,H,dpr;
function SC(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;C.style.width=W+"px";C.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",SC);SC();
var RB=["#ff4477","#ff9944","#ffee44","#44dd77","#44ddee","#5577ff","#bb55ff"];
var st="play",sc=0,best=0|(localStorage.getItem("rus2_best")||0),lives=3,got=[0,0,0,0,0,0,0],gotN=0,burst=0,invul=0,spd=1,f=0,shootCd=0,overAt=0,boss=null,bossActive=false,bossDone=false,bossAtk=0,killCount=0,upgActive=false,weapon={rate:10,dmg:1,multi:1,shield:0,shieldAng:0};
bestEl.textContent=best?"BEST "+best:"";
var uni={x:140,y:H/2,tx:140,ty:H/2,sz:30,tr:[]};
var bullets=[],enemies=[],ebullets=[],gems=[],parts=[],bgc=[],stars=[],rings=[],meteors=[];
for(var i=0;i<14;i++)bgc.push({x:Math.random()*W,y:Math.random()*H,r:30+Math.random()*60,s:.1+Math.random()*.35,a:.04+Math.random()*.06});
for(i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.7,r:Math.random()*1.5+.3,tw:Math.random()*6.283,sp:.02+Math.random()*.05,c:Math.random()<.3?RB[0|Math.random()*7]:null});
var dots=[];
for(i=0;i<7;i++){var d=document.createElement("div");d.className="cc";d.style.background=RB[i];d.style.color=RB[i];colEl.appendChild(d);dots.push(d)}
function updCol(){for(i=0;i<7;i++)dots[i].classList.toggle("on",!!got[i])}
function updLives(){var s="";for(var i=0;i<lives;i++)s+="♡";livesEl.textContent=s}
var mx=140,my=H/2,pa=false;
C.addEventListener("mousemove",function(e){mx=e.clientX;my=e.clientY;pa=true});
C.addEventListener("touchmove",function(e){e.preventDefault();mx=e.touches[0].clientX;my=e.touches[0].clientY;pa=true},{passive:false});
var keys={};
addEventListener("keydown",function(e){keys[e.key]=true;});
addEventListener("keyup",function(e){keys[e.key]=false});

function sEnemy(){
var hp=1+(0|(sc/350));if(hp>4)hp=4;
var y=50+Math.random()*(H-100);
enemies.push({x:W+80,y:y,vy:(Math.random()-.5)*1.2,baseY:y,phase:Math.random()*6.283,size:32+hp*6,hp:hp,maxhp:hp,shoot:70+0|Math.random()*90,hit:0});
}
function sGem(){gems.push({x:W+30,y:40+Math.random()*(H-80),c:0|Math.random()*7,r:11,rot:0,ph:Math.random()*6.283})}
function spawnBoss(){
boss={x:W+120,y:H/2,tx:W*.72,ty:H/2,hp:80,maxhp:80,size:70,phase:0,atkCd:90,atkType:0,hit:0,entering:true,moveT:0};
bossActive=true;enemies=[];ebullets=[];
for(var i=0;i<30;i++)addP(W*.72,H/2,RB[i%7],1,6);
}
var TIERS=[
{name:"White",color:"#ffffff",mult:1},
{name:"Cyan",color:"#44ddee",mult:1.4},
{name:"Blue",color:"#5577ff",mult:1.8},
{name:"Pink",color:"#ff66aa",mult:2.2},
{name:"Gold",color:"#ffdd44",mult:2.6},
{name:"Red",color:"#ff3344",mult:3.2}
];
function randTier(){var r=Math.random();if(r<.32)return 0;if(r<.56)return 1;if(r<.74)return 2;if(r<.88)return 3;if(r<.96)return 4;return 5;}
var upgList=[
{name:"Rapid Fire",desc:"Shoot faster",apply:function(m){weapon.rate=Math.max(3,Math.round(weapon.rate-2*m))}},
{name:"Power Shot",desc:"Bullets +damage",apply:function(m){weapon.dmg+=Math.max(1,Math.round(m))}},
{name:"Multi Beam",desc:"Wider spread",apply:function(m){weapon.multi=m>=2?5:3}},
{name:"Heal",desc:"Restore life",apply:function(m){lives=Math.min(3,lives+Math.max(1,Math.round(m)));updLives()}},
{name:"Hyper Speed",desc:"Faster bullets",apply:function(m){weapon.bspd=(weapon.bspd||11)+Math.round(3*m)}},
{name:"Rainbow Guard",desc:"Orbiting shield",apply:function(m){weapon.shield=(weapon.shield||0)+Math.max(1,Math.round(m))}}
];
function addP(px,py,col,n,spd){spd=spd||4;for(var i=0;i<n;i++){var a=Math.random()*6.283,s=1+Math.random()*spd;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,lf:1,col:col,sz:2+Math.random()*3.5})}}
function addRing(x,y,col){rings.push({x:x,y:y,r:6,vr:4.5,lf:1,col:col})}
function cc(x1,y1,r1,x2,y2,r2){var dx=x1-x2,dy=y1-y2;return dx*dx+dy*dy<(r1+r2)*(r1+r2)}
function upd(){
f++;
for(var i=0;i<bgc.length;i++){var b=bgc[i];b.x-=b.s*spd*.5;if(b.x<-b.r){b.x=W+b.r;b.y=Math.random()*H}}
for(i=0;i<stars.length;i++){var s=stars[i];s.x-=s.sp*spd;s.tw+=.05;if(s.x<0){s.x=W;s.y=Math.random()*H*.7}}
if(Math.random()<.008&&meteors.length<2)meteors.push({x:Math.random()*W,y:Math.random()*H*.3,vx:7+Math.random()*5,vy:2.5+Math.random()*3,lf:1});
for(i=meteors.length-1;i>=0;i--){var mt=meteors[i];mt.x+=mt.vx;mt.y+=mt.vy;mt.lf-=.022;if(mt.lf<=0||mt.x>W+60||mt.y>H+60)meteors.splice(i,1)}
for(i=rings.length-1;i>=0;i--){var R=rings[i];R.r+=R.vr;R.vr*=.96;R.lf-=.022;if(R.lf<=0)rings.splice(i,1)}
if(st!=="play"||upgActive)return;
spd=1+Math.min(2.2,sc/700);
if(pa){uni.tx=Math.max(40,Math.min(W*.55,mx));uni.ty=Math.max(35,Math.min(H-35,my))}
if(keys.ArrowUp||keys.w||keys.W){uni.ty-=8;pa=false}
if(keys.ArrowDown||keys.s||keys.S){uni.ty+=8;pa=false}
if(keys.ArrowLeft||keys.a||keys.A){uni.tx-=8;pa=false}
if(keys.ArrowRight||keys.d||keys.D){uni.tx+=8;pa=false}
uni.tx=Math.max(40,Math.min(W*.55,uni.tx));uni.ty=Math.max(35,Math.min(H-35,uni.ty));
uni.x+=(uni.tx-uni.x)*.22;uni.y+=(uni.ty-uni.y)*.22;
uni.tr.push({x:uni.x-22,y:uni.y+2,c:f%7});if(uni.tr.length>24)uni.tr.shift();
if(invul>0)invul--;if(burst>0)burst--;if(weapon.shield>0)weapon.shieldAng+=.04;
shootCd--;
if(shootCd<=0){
shootCd=burst>0?5:weapon.rate;
var hx=uni.x+34,hy=uni.y-26,bspd=weapon.bspd||11;
if(weapon.multi>=5){
bullets.push({x:hx,y:hy,vx:bspd,vy:0,c:f%7,r:5,dmg:weapon.dmg,trail:[]});
bullets.push({x:hx,y:hy,vx:bspd*.93,vy:-2.2,c:(f+1)%7,r:5,dmg:weapon.dmg,trail:[]});
bullets.push({x:hx,y:hy,vx:bspd*.93,vy:2.2,c:(f+2)%7,r:5,dmg:weapon.dmg,trail:[]});
bullets.push({x:hx,y:hy,vx:bspd*.85,vy:-4.5,c:(f+3)%7,r:5,dmg:weapon.dmg,trail:[]});
bullets.push({x:hx,y:hy,vx:bspd*.85,vy:4.5,c:(f+4)%7,r:5,dmg:weapon.dmg,trail:[]});
}else if(weapon.multi>=3){
bullets.push({x:hx,y:hy,vx:bspd,vy:0,c:f%7,r:5,dmg:weapon.dmg,trail:[]});
bullets.push({x:hx,y:hy,vx:bspd*.92,vy:-2.5,c:(f+2)%7,r:5,dmg:weapon.dmg,trail:[]});
bullets.push({x:hx,y:hy,vx:bspd*.92,vy:2.5,c:(f+4)%7,r:5,dmg:weapon.dmg,trail:[]});
}else bullets.push({x:hx,y:hy,vx:bspd,vy:0,c:f%7,r:5,dmg:weapon.dmg,trail:[]});
if(burst>0){bullets.push({x:hx,y:hy,vx:bspd*.85,vy:-4,c:(f+1)%7,r:5,dmg:weapon.dmg,trail:[]});bullets.push({x:hx,y:hy,vx:bspd*.85,vy:4,c:(f+3)%7,r:5,dmg:weapon.dmg,trail:[]});}
addP(hx,hy,RB[f%7],3,2);
}
if(!bossActive&&!bossDone&&sc>=5000)spawnBoss();
if(!bossActive&&f%Math.max(38,85-(0|sc/180))===0)sEnemy();
if(f%60===0)sGem();
for(i=bullets.length-1;i>=0;i--){var bl=bullets[i];bl.trail.push({x:bl.x,y:bl.y});if(bl.trail.length>5)bl.trail.shift();bl.x+=bl.vx;bl.y+=bl.vy;if(bl.x>W+20){bullets.splice(i,1);continue}
var hit=false;
for(var j=enemies.length-1;j>=0;j--){var e=enemies[j];
if(cc(bl.x,bl.y,bl.r,e.x,e.y,e.size*.7)){
e.hp-=bl.dmg;e.hit=10;hit=true;addP(bl.x,bl.y,RB[bl.c],6,3);
if(e.hp<=0){addP(e.x,e.y,"#fff",22,5);for(var k=0;k<3;k++)addP(e.x,e.y,RB[0|Math.random()*7],8,4);addRing(e.x,e.y,RB[0|Math.random()*7]);sc+=30*e.maxhp;enemies.splice(j,1);killCount++;if(killCount>=10&&!upgActive)showUpg();}
break;
}}
if(hit)bullets.splice(i,1);
else if(bossActive&&cc(bl.x,bl.y,bl.r,boss.x,boss.y,boss.size*.7)){
boss.hp-=bl.dmg;boss.hit=8;addP(bl.x,bl.y,RB[bl.c],5,3);
if(boss.hp<=0){
for(var k=0;k<50;k++)addP(boss.x,boss.y,RB[k%7],2,7);
addP(boss.x,boss.y,"#fff",30,8);addRing(boss.x,boss.y,"#ffdd44");addRing(boss.x,boss.y,"#ff4477");sc+=1500;invul=120;bossActive=false;bossDone=true;boss=null;ebullets=[];
}
bullets.splice(i,1);
}
}
for(i=enemies.length-1;i>=0;i--){var e=enemies[i];e.x-=2*spd;e.phase+=.03;e.y=e.baseY+Math.sin(e.phase)*25;if(e.hit>0)e.hit--;
e.shoot--;
if(e.shoot<=0&&e.x<W-60){e.shoot=90+0|Math.random()*110;
var dx=uni.x-e.x,dy=uni.y-e.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
ebullets.push({x:e.x,y:e.y+e.size*.3,vx:dx/dist*3.2,vy:dy/dist*3.2,r:6,ph:0})}
if(e.x<-e.size*2){enemies.splice(i,1);continue}
if(invul<=0&&burst<=0&&cc(uni.x,uni.y,uni.sz*.55,e.x,e.y,e.size*.7)){
lives--;updLives();invul=100;addP(uni.x,uni.y,"#ff4477",24,5);enemies.splice(i,1);
if(lives<=0){over();return}
}
}
if(bossActive&&boss){
if(boss.entering){boss.x+=(boss.tx-boss.x)*.05;if(Math.abs(boss.x-boss.tx)<5)boss.entering=false}
else{
boss.moveT+=.035;boss.ty=H/2+Math.sin(boss.moveT)*H*.28;boss.tx=W*.66+Math.sin(boss.moveT*.7)*W*.1;boss.y+=(boss.ty-boss.y)*.08;boss.x+=(boss.tx-boss.x)*.04;
boss.atkCd--;
if(boss.atkCd<=0){
boss.atkType=(boss.atkType+1)%3;
if(boss.atkType===0){for(var bi=-3;bi<=3;bi++){var ang=Math.PI+bi*.18;ebullets.push({x:boss.x-30,y:boss.y,vx:Math.cos(ang)*3.5,vy:Math.sin(ang)*3.5,r:7,ph:0})}boss.atkCd=80}
else if(boss.atkType===1){for(var si=0;si<2;si++){var sy=boss.y+(si===0?-60:60);enemies.push({x:boss.x-40,y:sy,vy:(Math.random()-.5)*2,baseY:sy,phase:Math.random()*6.283,size:28,hp:2,maxhp:2,shoot:100+0|Math.random()*60,hit:0})}boss.atkCd=100}
else{var dx2=uni.x-boss.x,dy2=uni.y-boss.y,dt=Math.sqrt(dx2*dx2+dy2*dy2)||1,ba=Math.atan2(dy2,dx2);for(var ai=-1;ai<=1;ai++)ebullets.push({x:boss.x-30,y:boss.y,vx:Math.cos(ba+ai*.15)*4.5,vy:Math.sin(ba+ai*.15)*4.5,r:6,ph:0});boss.atkCd=70}
}
}
if(boss.hit>0)boss.hit--;
if(invul<=0&&burst<=0&&cc(uni.x,uni.y,uni.sz*.55,boss.x,boss.y,boss.size*.6)){lives--;updLives();invul=100;addP(uni.x,uni.y,"#ff4477",24,5);if(lives<=0){over();return}}
}
for(i=ebullets.length-1;i>=0;i--){var eb=ebullets[i];eb.ph+=.2;eb.x+=eb.vx;eb.y+=eb.vy;if(eb.x<-30||eb.x>W+30||eb.y<-30||eb.y>H+30){ebullets.splice(i,1);continue}
if(invul<=0&&burst<=0&&cc(uni.x,uni.y,uni.sz*.5,eb.x,eb.y,eb.r)){
lives--;updLives();invul=100;addP(uni.x,uni.y,"#ffee44",18,4);ebullets.splice(i,1);
if(lives<=0){over();return}
}
}
for(i=gems.length-1;i>=0;i--){var g=gems[i];g.x-=2.2*spd;g.rot+=.05;g.ph+=.08;g.y+=Math.sin(g.ph)*.5;if(g.x<-30){gems.splice(i,1);continue}
if(cc(uni.x,uni.y,uni.sz,g.x,g.y,g.r)){
if(!got[g.c]){got[g.c]=1;gotN++;sc+=40;updCol();addRing(g.x,g.y,RB[g.c]);
if(gotN===7){burst=260;sc+=250;got=[0,0,0,0,0,0,0];gotN=0;updCol();for(var j=0;j<7;j++)addP(uni.x,uni.y,RB[j],14,5);for(var r=0;r<7;r++)addRing(uni.x,uni.y,RB[r]);}}
else sc+=8;
addP(g.x,g.y,RB[g.c],10,3);gems.splice(i,1)}
}
for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.98;p.lf-=.02;if(p.lf<=0)parts.splice(i,1)}
sc+=.06;scoreEl.textContent=0|sc;
}
function drUni(ux,uy,t){
ctx.save();ctx.translate(ux,uy);
var bob=Math.sin(t*.08)*2;ctx.translate(0,bob);
if(invul>0&&Math.floor(t/5)%2===0&&burst<=0)ctx.globalAlpha=.35;
for(var i=6;i>=0;i--){
ctx.fillStyle=RB[i];ctx.globalAlpha=(invul>0&&Math.floor(t/5)%2===0&&burst<=0)?.25:.85;
ctx.beginPath();
var tx=-22+Math.sin(t*.06+i*.8)*5,ty=-2+i*3.5;
ctx.ellipse(tx,ty,14-i*.8,4.5-i*.3,-.35+i*.05,0,6.283);ctx.fill();
}
ctx.globalAlpha=(invul>0&&Math.floor(t/5)%2===0&&burst<=0)?.35:1;
ctx.fillStyle="#f5f0ff";
ctx.fillRect(-12,14,6,14+Math.sin(t*.25)*2);
