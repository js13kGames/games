<html> <head> <title>I&#39;ve lost my doge - js13kGames 2017</title> <style>img{position:absolute;display:block;width:32px;height:32px}#s{position:absolute;top:0;left:0;background:#fff;opacity:.8;padding:5px;z-index:999}#d{cursor:pointer}</style> <script>var imgs=[],size=10,found=0,start=+new Date;function randomInt(min,max){return Math.floor(Math.random()*(max-min+1)+min)}function createMap(size){for(var html="",x=0;x<size;++x)for(var y=0;y<size;++y)html+='<img src="'+randomInt(0,9)+'.jpg" style="left: '+32*x+"px; top: "+32*y+'px">';html+='<img src="d.jpg" id="d" style="left: '+32*(x=randomInt(1,size-2))+"px; top: "+32*(y=randomInt(1,size-2))+'px">',document.getElementById("x").innerHTML=html,document.getElementById("d").onclick=onDogeClick}function onDogeClick(){found++,createMap(size+=5)}function score(){var time=(+new Date-start)/1e3;document.getElementById("s").innerHTML="Found "+found+" in "+time.toFixed(1)+" secs"}window.onload=function(){createMap(size),window.setInterval(score,250)}</script> </head> <body> <div id="s"></div> <div id="x"></div> </body> </html>
