<!DOCTYPE html><html><head><title>Editor</title><link rel="stylesheet" href="css.css"></head><body><div id="container"><div id="t"></div></div><p><span id="colorsDisplay"></span></p><p><input type="button" id="newT" value="New Table"><input type="button" id="printR" value="Print Result"><input type="button" id="play" value="Play this level"></p><p id="result"><script>var ar,elAr,iters,endAr,clicks,colors=["white","#0080AA","#A0AA00","#C8C8FA","#F03232"],containW=500;function getClick(x,y){return function(){update(x,y)}}function initTable(ww,hh,variations){for(iters=variations,ar=[],elAr=[],clicks=[],endAr=[ww,hh,variations];t.childNodes.length>0;)t.removeChild(t.childNodes[0]);for(;colorsDisplay.childNodes.length>0;)colorsDisplay.removeChild(colorsDisplay.childNodes[0]);for(var col=0;col<hh;++col){var tr=document.createElement("div");t.appendChild(tr),ar.push([]),elAr.push([]),clicks.push([]);for(var row=0;row<ww;++row){var cell=document.createElement("cell");cell.addEventListener("click",getClick(col,row)),tr.appendChild(cell),ar[col].push(0),elAr[col].push(cell),clicks[col].push(0)}}t.style.setProperty("height",containW/ww*hh+"px")}function updateEl(x,y){elAr[x][y].style.setProperty("background-color",colors[ar[x][y]])}function updateVal(x,y){ar[x][y]+=1,ar[x][y]%=iters}function updateCell(x,y){elAr[x]&&elAr[x][y]&&(updateVal(x,y),updateEl(x,y))}function update(x,y){clicks[x][y]+=1,clicks[x][y]%=iters,updateCell(x,y),updateCell(x+1,y),updateCell(x-1,y),updateCell(x,y+1),updateCell(x,y-1)}function getRes(){for(var off=[],i=0;i<clicks.length;++i)for(var j=0;j<clicks[i].length;++j)clicks[i][j]>0&&off.push(i,j,clicks[i][j]);return"custom level."+endAr[0]+"."+endAr[1]+"."+endAr[2]+"."+off.join(".")}function ask(questions,onsubmit){for(var asker=document.createElement("asker"),i=0;i<questions.length;++i){(p=document.createElement("p")).innerHTML=questions[i]+"<br><input id=asker"+i+" class=question>",asker.appendChild(p)}var p;(p=document.createElement("p")).innerHTML="
