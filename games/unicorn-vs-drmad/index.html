}
#easterCanvas{

@media(max-width:600px){

  align-items:flex-start;

  width:560px;

  transform:scale(calc((100vw - 12px)/560))
 }
 #gameTitle{font-size:28px}
}
</style>

<body>
<div id="startScreen">
 <h1 id="gameTitle">UNICORN VS DR.MAD</h1>
 <button id="startBtn">START</button>
 <div id="premise">

</div>

<canvas id="easterCanvas"></canvas>

<div id="wrap">

 </div>

  <span>UNICORN LV4</span>

 </div>
</div>

<div id="dialog"><div id="dialogText"></div></div>
<div id="ov"></div>

<script>
var MW=560,MH=170,BW=360,BH=360;

var menuCv=document.getElementById("menuCv");
var battleCv=document.getElementById("battleCv");
var mc=menuCv.getContext("2d");
var bc=battleCv.getContext("2d");

var boss=document.getElementById("boss");
var bctx=boss.getContext("2d");

var ov=document.getElementById("ov");
var dialog=document.getElementById("dialog");
var dialogText=document.getElementById("dialogText");

var startScreen=document.getElementById("startScreen");
var startBtn=document.getElementById("startBtn");
var gameTitle=document.getElementById("gameTitle");
var premise=document.getElementById("premise");

var easterCanvas=document.getElementById("easterCanvas");
var easterCtx=easterCanvas.getContext("2d");

var keys={};
var bullets=[];
var fpos=0;
var fdir=1;
var lastMercyDialog=-1;
var titleClicks=0;
var startReady=false;
var easterPlaying=false;
var AC=null;
var master=null;
var musicTimer=null;
var musicStep=0;
var musicNextTime=0;
var musicNotes=[261.63,329.63,392,523.25,440,392,329.63,293.66];

function audioOn(){
 if(!AC){
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;

  AC=new C();
  master=AC.createGain();
  master.gain.value=.3;
  master.connect(AC.destination);
 }

 if(AC.state==="suspended"){
  AC.resume().then(startMusic);
 }else{
  startMusic();
 }
}

function tone(f,d,type,to){
 if(!AC)return;

 var t=AC.currentTime;
 var o=AC.createOscillator();
 var g=AC.createGain();

 o.type=type||"square";
 o.frequency.setValueAtTime(f,t);

 if(to){
  o.frequency.exponentialRampToValueAtTime(
   Math.max(30,to),
   t+d
  );
 }

 g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(.3,t+.005);
 g.gain.exponentialRampToValueAtTime(.0001,t+d);

 o.connect(g);
 g.connect(master);

 o.start(t);
 o.stop(t+d+.02);
}
function musicTone(f,start,d){
 if(!AC||!master)return;

 var o=AC.createOscillator();
 var g=AC.createGain();

 o.type="triangle";
 o.frequency.setValueAtTime(f,start);

 g.gain.setValueAtTime(.0001,start);
 g.gain.exponentialRampToValueAtTime(.4,start+.015);
 g.gain.exponentialRampToValueAtTime(.0001,start+d);

 o.connect(g);
 g.connect(master);

 o.start(start);
 o.stop(start+d+.02);
}

function scheduleMusic(){
 if(!AC||!master)return;

 while(musicNextTime<AC.currentTime+.12){
  musicTone(
   musicNotes[musicStep],
   musicNextTime,
   .22
  );

  musicStep=(musicStep+1)%musicNotes.length;
  musicNextTime+=.25;
 }

 musicTimer=setTimeout(scheduleMusic,50);
}

function startMusic(){
 if(!AC||musicTimer!==null)return;

 musicStep=0;
 musicNextTime=AC.currentTime+.05;
 scheduleMusic();
}

function stopMusic(){
 if(musicTimer!==null){
  clearTimeout(musicTimer);
  musicTimer=null;
 }
}
function sfx(n){
 if(!AC)return;

 if(n==="hit"){
  tone(95,.09,"sawtooth",42);
 }else if(n==="attack"){
  tone(180,.12,"square",620);
 }else if(n==="laser"){
  tone(760,.22,"sawtooth",120);
 }else if(n==="boom"){
  tone(110,.28,"sawtooth",38);
  setTimeout(function(){
   tone(55,.18,"square",30);
  },45);
 }else if(n==="select"){
  tone(420,.045,"square",520);
 }else if(n==="mercy"){
  tone(330,.18,"triangle",660);
 }
}

var S={
 hp:40,
 mhp:40,
 bhp:400,
 bmhp:400,
 mercy:0,
 healCd:0,
 curse:0,
 ctick:0,
 clicks:0,
 mode:"start",
 t:0,
 turnLimit:16,
 hue:0,
 sel:0,
 msel:0,
 isel:0,
 inv:0,
 final:false,
 pat:0,
 shake:0,
 battleShake:0,
 msg:"",
 msgT:0,
 moving:false
};

var heart={x:BW/2,y:BH/2};

var items=[
 {n:"RAINBOW CANDY",h:15,c:3},
 {n:"UNICORN TEAR",h:40,c:1}
];

var mercyDialogs=[
 "* Do you really believe mercy solves everything?",
 "* You will be another experiment sample, unless... you give up.",
 "* Perhaps... I have gone too far..."
];

function viewMenu(){
 menuCv.style.display="block";
 battleCv.style.display="none";
}

function viewBattle(){
 menuCv.style.display="none";
 battleCv.style.display="block";
}

function hurt(n){
 if(S.mode!=="enemy"||S.inv>0)return;

 S.hp-=n;
 S.inv=.62;
 S.shake=.18;
 sfx("hit");
 if(S.hp<=0){
  S.hp=0;
  gameOver();
 }
}

function distance(x,y,a,b){
 return Math.hypot(x-a,y-b);
}

function lineHit(x,y,ang,len,width){
 var dx=Math.cos(ang);
 var dy=Math.sin(ang);
 var px=heart.x-x;
 var py=heart.y-y;
 var side=Math.abs(px*dy-py*dx);
 var along=px*dx+py*dy;

 return side<(width||11)&&Math.abs(along)<len/2;
}

function spawnLaser(){
 var side=Math.floor(Math.random()*4);
 var x,y;

 if(side===0){
  x=-28;
  y=28+Math.random()*(BH-56);
 }else if(side===1){
  x=BW+28;
  y=28+Math.random()*(BH-56);
 }else if(side===2){
  x=28+Math.random()*(BW-56);
  y=-28;
 }else{
  x=28+Math.random()*(BW-56);
  y=BH+28;
 }

 var targetX=heart.x+(Math.random()-.5)*28;
 var targetY=heart.y+(Math.random()-.5)*28;

 bullets.push({
  type:"laser",
  x:x,
  y:y,
  a:Math.atan2(targetY-y,targetX-x),
  charge:.72,
  maxCharge:.72,
  fire:.48,
  len:720,
 fired:false
 });
}

function spawnPoison(){
 var left=Math.random()<.5;
 var speed=180+Math.random()*140;
 var startY=20+Math.random()*150;
 var launchY=-260+Math.random()*520;

 bullets.push({
  type:"poison",
  x:left?-28:BW+28,
  y:startY,
  vx:left?speed:-speed,
  vy:launchY,
  g:520,
  life:5,
  rot:Math.random()*6.283,
  vr:(left?1:-1)*(4+Math.random()*4)
 });
}

function createPoisonCloud(x,y){
 bullets.push({
  type:"cloud",
  x:Math.max(0,Math.min(BW,x)),
  y:Math.max(0,Math.min(BH-20,y)),
  r:8,
  max:48,
  life:4.2,
  tick:0
 });
}

function spawnDrop(){
 var roll=Math.random();
 var color=roll<.34?"white":roll<.67?"orange":"blue";

 bullets.push({
  type:"drop",
  x:8+Math.random()*(BW-16),
  y:-15,
  vx:(Math.random()-.5)*35,
  vy:110+Math.random()*110,
  color:color,
  r:7
 });
}

function spawnBomb(){
 var blast=52+Math.random()*24;

 bullets.push({
  type:"bomb",
  x:blast+8+Math.random()*(BW-blast*2-16),
  y:blast+8+Math.random()*(BH-blast*2-36),
  warning:1.2,
  elapsed:0,
  blast:blast,
  r:0
 });
}

function spawnKnife(){
 var side=Math.floor(Math.random()*4);
 var x,y,vx,vy;

 if(side===0){
  x=Math.random()*BW;
  y=-35;
  vx=0;
  vy=215;
 }else if(side===1){
  x=BW+35;
  y=Math.random()*BH;
  vx=-215;
  vy=0;
 }else if(side===2){
  x=Math.random()*BW;
  y=BH+35;
  vx=0;
  vy=-215;
 }else{
  x=-35;
  y=Math.random()*BH;
  vx=215;
  vy=0;
 }

 bullets.push({
  type:"knife",
  x:x,
  y:y,
  vx:vx,
  vy:vy,
  a:Math.atan2(vy,vx),
  life:3
 });
}

function randomOtherSide(side){
 var next=Math.floor(Math.random()*3);

 if(next>=side){
  next++;
 }

 return next;
}

function spawnNeedle(side){
 var x,y,vx,vy;
 var speed=300+Math.random()*100;
 var drift=(Math.random()-.5)*110;

 if(side===0){
  x=12+Math.random()*(BW-24);
  y=-34;
  vx=drift;
  vy=speed;
 }else if(side===1){
  x=BW+34;
  y=12+Math.random()*(BH-24);
  vx=-speed;
  vy=drift;
 }else if(side===2){
  x=12+Math.random()*(BW-24);
  y=BH+34;
  vx=drift;
  vy=-speed;
 }else{
  x=-34;
  y=12+Math.random()*(BH-24);
  vx=speed;
  vy=drift;
 }

 bullets.push({
  type:"needle",
  x:x,
  y:y,
  vx:vx,
  vy:vy,
  a:Math.atan2(vy,vx),
  life:3
 });
}

function spawnTrackerGroup(gid){
 for(var i=0;i<4;i++){
  var x,y;

  if(i===0){
   x=30+Math.random()*(BW-60);
   y=-24;
  }else if(i===1){
   x=BW+24;
   y=30+Math.random()*(BH-60);
  }else if(i===2){
   x=30+Math.random()*(BW-60);
   y=BH+24;
  }else{
   x=-24;
   y=30+Math.random()*(BH-60);
  }

  var dx=heart.x-x;
  var dy=heart.y-y;
  var len=Math.hypot(dx,dy)||1;
  var speed=105+Math.random()*30;

  bullets.push({
   type:"tracker",
   gid:gid,
   x:x,
   y:y,
   vx:dx/len*speed,
   vy:dy/len*speed,
   speed:speed,
   phase:Math.random()*6.283,
   life:12
  });
 }
}

var PAT=[
 {
  init:function(){
   spawnLaser();
   spawnLaser();
   spawnLaser();
   bullets.push({type:"laserCtl",next:.45});
  },
  run:function(dt){
   for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];

    if(b.type==="laserCtl"){
     b.next-=dt;

     if(b.next<=0){
      b.next=.40+Math.random()*.55;
      spawnLaser();

      if(Math.random()<.25){
       spawnLaser();
      }
     }
    }

    if(b.type==="laser"){
     if(b.charge>0){
      b.charge-=dt;
      if(b.charge<=0&&!b.fired){
  b.fired=true;
  sfx("laser");
 }
     }else{
      b.fire-=dt;

      if(lineHit(b.x,b.y,b.a,b.len,12)){
       hurt(4);
      }

      if(b.fire<=0){
       bullets.splice(i,1);
      }
     }
    }
   }
  }
 },
 {
  init:function(){
   bullets.push({type:"ps",next:.05});
  },
  run:function(dt){
   for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];

    if(b.type==="ps"){
     b.next-=dt;

     if(b.next<=0){
      b.next=.18+Math.random()*.22;
      spawnPoison();

      if(Math.random()<.48){
       spawnPoison();
      }
     }
    }

    if(b.type==="poison"){
     b.vy+=b.g*dt;
     b.x+=b.vx*dt;
     b.y+=b.vy*dt;
     b.rot+=b.vr*dt;
     b.life-=dt;

     if(distance(heart.x,heart.y,b.x,b.y)<17){
      createPoisonCloud(b.x,b.y);
      hurt(2);
      bullets.splice(i,1);
      continue;
     }

     if(b.y>=BH-24){
      createPoisonCloud(b.x,BH-24);
      bullets.splice(i,1);
      continue;
     }

     if(b.life<=0||b.x<-80||b.x>BW+80){
      bullets.splice(i,1);
     }
    }

    if(b.type==="cloud"){
     b.life-=dt;
     b.tick+=dt;
     b.r=Math.min(b.max,b.r+dt*105);

     if(b.tick>=.25){
      b.tick=0;

      if(distance(heart.x,heart.y,b.x,b.y)<b.r){
       hurt(2);
      }
     }

     if(b.life<=0){
      bullets.splice(i,1);
     }
    }
   }
  }
 },
 {
  init:function(){
   bullets.push({type:"water",h:0});
   bullets.push({type:"waterCtl",next:.02});
  },
  run:function(dt){
   for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];

    if(b.type==="water"){
     b.h=Math.min(125,b.h+dt*8.2);

     if(heart.y>BH-b.h+3){
      hurt(1);
     }
    }

    if(b.type==="waterCtl"){
     b.next-=dt;

     if(b.next<=0){
      b.next=.045+Math.random()*.055;
      spawnDrop();

      if(Math.random()<.35){
       spawnDrop();
      }
     }
    }

    if(b.type==="drop"){
     b.vy+=95*dt;
     b.x+=b.vx*dt;
     b.y+=b.vy*dt;

     if(distance(heart.x,heart.y,b.x,b.y)<15){
      var shouldHurt=false;

      if(b.color==="white")shouldHurt=true;
      if(b.color==="orange"&&!S.moving)shouldHurt=true;
      if(b.color==="blue"&&S.moving)shouldHurt=true;

      if(shouldHurt)hurt(3);

      bullets.splice(i,1);
      continue;
     }

     if(b.y>=BH-12){
      bullets.splice(i,1);
     }
    }
   }
  }
 },
 {
  init:function(){
   bullets.push({type:"bs",next:.15});
  },
  run:function(dt){
   for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];

    if(b.type==="bs"){
     b.next-=dt;

     if(b.next<=0){
      b.next=.35+Math.random()*.38;
      spawnBomb();

      if(Math.random()<.18){
       spawnBomb();
      }
     }
    }

    if(b.type==="bomb"){
     b.warning-=dt;
     b.elapsed+=dt;

     var progress=Math.min(1,b.elapsed/1.2);
     b.r=b.blast*progress;

     if(b.warning<=0){
 S.battleShake=Math.max(S.battleShake,.4);
 sfx("boom");
      if(distance(heart.x,heart.y,b.x,b.y)<b.blast){
       hurt(7);
      }

      bullets.push({
       type:"blast",
       x:b.x,
       y:b.y,
       r:b.blast,
       life:.18
      });

      bullets.splice(i,1);
     }
    }

    if(b.type==="blast"){
     b.life-=dt;

     if(b.life<=0){
      bullets.splice(i,1);
     }
    }
   }
  }
 },
 {
  init:function(){
   bullets.push({type:"knifeCtl",next:.05});
  },
  run:function(dt){
   for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];

    if(b.type==="knifeCtl"){
     b.next-=dt;

     if(b.next<=0){
      b.next=.72+Math.random()*.25;

      bullets.push({
       type:"knifeCore",
       x:55+Math.random()*(BW-110),
       y:55+Math.random()*(BH-125),
       a:Math.random()*6.283,
       r:185,
       life:4.8
      });
     }
    }

    if(b.type==="knifeCore"){
     b.a+=dt*1.8;
     b.r-=dt*66;
     b.life-=dt;

     for(var k=0;k<6;k++){
      var a=b.a+k*Math.PI/3;
      var x=b.x+Math.cos(a)*b.r;
      var y=b.y+Math.sin(a)*b.r;

      if(distance(heart.x,heart.y,x,y)<19){
       hurt(4);
      }
     }

     if(b.r<=8||b.life<=0){
      bullets.splice(i,1);
     }
    }
   }
  }
 },
 {
  init:function(){
   bullets.push({
    type:"needleCtl",
    side:Math.floor(Math.random()*4),
    elapsed:0,
    warning:.8,
    next:.1
   });
  },
  run:function(dt){
   for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];

    if(b.type==="needleCtl"){
     b.elapsed+=dt;

     if(b.elapsed>=3){
      b.elapsed-=3;
      b.side=randomOtherSide(b.side);
      b.warning=.8;
      b.next=.08;
     }

     if(b.warning>0){
      b.warning-=dt;
     }else{
      b.next-=dt;

      if(b.next<=0){
       b.next=.12+Math.random()*.1;
       spawnNeedle(b.side);

       if(Math.random()<.28){
        spawnNeedle(b.side);
       }
      }
     }
    }

function heartPath(c,s){
 c.beginPath();

 for(var i=0;i<=24;i++){
  var t=i/24*6.283;
  var x=Math.pow(Math.sin(t),3)*16*s;
  var y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s;

  if(i)c.lineTo(x,y);
  else c.moveTo(x,y);
 }

 c.closePath();
}

  }
 }

 for(var ai=0;ai<bullets.length;ai++){
  var alert=bullets[ai];

  if(alert.type==="needleCtl"&&alert.warning>0){
   drawNeedleWarning(alert.side);
  }
 }

 for(var i=0;i<bullets.length;i++){
  var b=bullets[i];
  bc.save();

  if(b.type==="laser"){
   drawLaserCannon(b);
  }else if(b.type==="poison"){
   drawPoisonBottle(b);
  }else if(b.type==="cloud"){
   var cloudAlpha=Math.min(.34,b.life*.12);

   bc.fillStyle="rgba(150,255,90,"+cloudAlpha+")";
   bc.shadowColor="#9cff66";
   bc.shadowBlur=12;

   bc.beginPath();
   bc.arc(b.x,b.y,b.r,0,6.283);
   bc.fill();

   bc.shadowBlur=0;

   for(var c=0;c<7;c++){
    var ca=c/7*6.283+performance.now()/900;
    var cr=b.r*(.25+(c%3)*.18);

    bc.fillStyle="rgba(210,255,190,.18)";
    bc.beginPath();
    bc.arc(
     b.x+Math.cos(ca)*cr,
     b.y+Math.sin(ca)*cr,
     Math.max(3,b.r*.12),
     0,
     6.283
    );
    bc.fill();
   }
  }else if(b.type==="drop"){
   drawDrop(b);
  }else if(b.type==="bomb"){
   var bp=Math.min(1,b.elapsed/1.2);

   bc.fillStyle="rgba(255,0,0,"+(0.08+bp*.22)+")";
   bc.beginPath();
   bc.arc(b.x,b.y,b.r,0,6.283);
   bc.fill();

   bc.fillStyle="#fff";
   bc.shadowColor="#f44";
   bc.shadowBlur=8+bp*14;

   bc.beginPath();
   bc.arc(b.x,b.y,6+bp*4,0,6.283);
   bc.fill();

   bc.shadowBlur=0;
  }else if(b.type==="blast"){
   bc.fillStyle=
    "rgba(255,255,255,"+
    Math.max(0,b.life/.18*.65)+")";

   bc.beginPath();
   bc.arc(b.x,b.y,b.r,0,6.283);
   bc.fill();
  }else if(b.type==="knifeCore"){
   for(var k=0;k<6;k++){
    var a=b.a+k*Math.PI/3;
    var x=b.x+Math.cos(a)*b.r;
    var y=b.y+Math.sin(a)*b.r;

    bc.save();
    bc.translate(x,y);
    bc.rotate(a+Math.PI/2);

    bc.fillStyle="#fff";
    bc.strokeStyle="#111";
    bc.lineWidth=2;

    bc.beginPath();
    bc.moveTo(0,-25);
    bc.lineTo(7,15);
    bc.lineTo(0,23);
    bc.lineTo(-7,15);
    bc.closePath();
    bc.fill();
    bc.stroke();

    bc.restore();
   }

   bc.fillStyle="#fff";
   bc.beginPath();
   bc.arc(b.x,b.y,5,0,6.283);
   bc.fill();
  }else if(b.type==="needle"){
   drawNeedle(b);
  }else if(
   b.type==="tracker"||
   b.type==="trackerFreeze"||
   b.type==="trackerDash"
  ){
   drawTrackerBullet(b);
  }else if(b.type==="windmill"){
   for(var fk=0;fk<4;fk++){
    var fa=b.a+fk*Math.PI/2;
    var fdx=Math.cos(fa);
    var fdy=Math.sin(fa);

    bc.strokeStyle="#fff";
    bc.lineWidth=14;
    bc.shadowColor="#fff";
    bc.shadowBlur=15;

    bc.beginPath();
    bc.moveTo(
     b.x-fdx*b.len/2,
     b.y-fdy*b.len/2
    );
    bc.lineTo(
     b.x+fdx*b.len/2,
     b.y+fdy*b.len/2
    );
    bc.stroke();

    bc.strokeStyle="#111";
    bc.lineWidth=4;
    bc.shadowBlur=0;

    bc.beginPath();
    bc.moveTo(
     b.x-fdx*b.len/2,
     b.y-fdy*b.len/2
    );
    bc.lineTo(
     b.x+fdx*b.len/2,
     b.y+fdy*b.len/2
    );
    bc.stroke();
   }

   bc.fillStyle="#fff";
   bc.beginPath();
   bc.arc(b.x,b.y,15,0,6.283);
   bc.fill();
  }else if(b.type==="knife"){
   bc.translate(b.x,b.y);
   bc.rotate(b.a+Math.PI/2);

   bc.fillStyle="#fff";
   bc.strokeStyle="#111";
   bc.lineWidth=2;

   bc.beginPath();
   bc.moveTo(0,-27);
   bc.lineTo(8,16);
   bc.lineTo(0,24);
   bc.lineTo(-8,16);
   bc.closePath();
   bc.fill();
   bc.stroke();
  }

  bc.restore();
 }

 drawHeart();
 bc.restore();
}

function render(){
 if(S.mode==="enemy")renderEnemy();
 else if(S.mode==="fight")renderFight();
 else if(S.mode==="magic")renderMagic();
 else if(S.mode==="item")renderItems();
 else if(S.mode==="menu"||S.mode==="dialog")renderMenu();
}

function update(dt){
 S.hue=(S.hue+dt*90)%360;

 if(S.inv>0)S.inv-=dt;
 if(S.shake>0)S.shake-=dt;
if(S.battleShake>0)S.battleShake-=dt;
 if(S.msgT>0)S.msgT-=dt;

 if(S.curse>0){
  S.curse-=dt;
  S.ctick+=dt;

  while(S.ctick>=1){
   S.ctick-=1;
   dmgBoss(1,"curse");

   if(S.mode==="end")break;
  }
 }

 if(S.mode==="enemy"){
  S.t+=dt;

  if(S.t>=S.turnLimit){
   if(S.healCd>0)S.healCd--;
   startMenu();
   return;
  }

  var dx=0;
  var dy=0;

  if(keys.arrowleft||keys.a)dx--;
  if(keys.arrowright||keys.d)dx++;
  if(keys.arrowup||keys.w)dy--;
  if(keys.arrowdown||keys.s)dy++;

  S.moving=dx!==0||dy!==0;

  if(dx&&dy){
   dx*=.7071;
   dy*=.7071;
  }

  var sp=keys.shift?72:174;

  heart.x=Math.max(
   10,
   Math.min(BW-10,heart.x+dx*sp*dt)
  );

  heart.y=Math.max(
   10,
   Math.min(BH-10,heart.y+dy*sp*dt)
  );

  PAT[S.pat].run(dt,S.t);
 }

 if(S.mode==="fight"){
  fpos+=fdir*dt*1.1;

  if(fpos>1){
   fpos=1;
   fdir=-1;
  }

  if(fpos<0){
   fpos=0;
   fdir=1;
  }
 }
}

function drawBoss(){
 bctx.clearRect(0,0,260,230);

 var t=performance.now()/1000;
 var fl=Math.sin(t*1.8)*4;
 var side=Math.sin(t*1.35)*5;

 bctx.save();
 bctx.translate(side,fl);

 if(S.shake>0){
  bctx.translate(
   (Math.random()-.5)*8,
   (Math.random()-.5)*8
  );
 }

 var cx=130;

 bctx.strokeStyle="#d0d0d0";
 bctx.lineWidth=20;
 bctx.lineCap="round";

 bctx.beginPath();
 bctx.moveTo(cx-44,135);
 bctx.lineTo(cx-74,188);
 bctx.stroke();

 bctx.beginPath();
 bctx.moveTo(cx+44,135);
 bctx.lineTo(cx+74,188);
 bctx.stroke();

 bctx.beginPath();
 bctx.moveTo(cx-44,118);
 bctx.lineTo(cx+44,118);
 bctx.lineTo(cx+58,210);
 bctx.lineTo(cx-58,210);
 bctx.closePath();

 bctx.fillStyle="#e9e9e9";
 bctx.fill();

 bctx.strokeStyle="#111";
 bctx.lineWidth=3;
 bctx.stroke();

 bctx.beginPath();
 bctx.moveTo(cx-44,118);
 bctx.lineTo(cx,155);
 bctx.lineTo(cx+44,118);
 bctx.closePath();

 bctx.fillStyle="#fff";
 bctx.fill();
 bctx.stroke();

 bctx.fillStyle="#222";
 bctx.beginPath();
 bctx.moveTo(cx-10,120);
 bctx.lineTo(cx,140);
 bctx.lineTo(cx+10,120);
 bctx.closePath();
 bctx.fill();

 bctx.fillStyle="#ddd";
 bctx.fillRect(cx-12,100,24,22);

 bctx.strokeStyle="#111";
 bctx.lineWidth=2.5;
 bctx.strokeRect(cx-12,100,24,22);

 bctx.beginPath();
 bctx.ellipse(cx,72,31,35,0,0,6.283);

 bctx.fillStyle="#f2f2f2";
 bctx.fill();

 bctx.strokeStyle="#111";
 bctx.lineWidth=3;
 bctx.stroke();

 bctx.beginPath();
 bctx.moveTo(cx-31,60);
 bctx.quadraticCurveTo(cx-56,18,cx-30,26);
 bctx.quadraticCurveTo(cx-36,-2,cx-6,22);
 bctx.quadraticCurveTo(cx+4,-14,cx+18,22);
 bctx.quadraticCurveTo(cx+42,-2,cx+34,30);
 bctx.quadraticCurveTo(cx+58,26,cx+31,60);
 bctx.quadraticCurveTo(cx+20,42,cx,44);
 bctx.quadraticCurveTo(cx-20,42,cx-31,60);
 bctx.closePath();

 bctx.fillStyle="#fff";
 bctx.fill();

 bctx.strokeStyle="#111";
 bctx.stroke();

 bctx.strokeStyle="#111";
 bctx.lineWidth=3;

 bctx.beginPath();
 bctx.moveTo(cx-42,68);
 bctx.lineTo(cx-19,72);
 bctx.stroke();

 bctx.beginPath();
 bctx.moveTo(cx+42,68);
 bctx.lineTo(cx+19,72);
 bctx.stroke();

 for(var s=-1;s<=1;s+=2){
  bctx.fillStyle="#111";
  bctx.beginPath();
  bctx.arc(cx+s*15,72,11,0,6.283);
  bctx.fill();

  bctx.fillStyle=S.final?"#777":"#fff";
  bctx.beginPath();
  bctx.arc(cx+s*15,72,7,0,6.283);
  bctx.fill();

  bctx.fillStyle="#fff";
  bctx.beginPath();
  bctx.arc(cx+s*15-3,69,3,0,6.283);
  bctx.fill();
 }

 bctx.strokeStyle="#111";
 bctx.lineWidth=4;

 bctx.beginPath();
 bctx.moveTo(cx-4,72);
 bctx.lineTo(cx+4,72);
 bctx.stroke();

 bctx.beginPath();
 bctx.moveTo(cx-17,94);
 bctx.quadraticCurveTo(cx,116,cx+17,94);
 bctx.closePath();

 bctx.fillStyle="#111";
 bctx.fill();

 bctx.fillStyle="#fff";

 for(var i=-2;i<=2;i++){
  bctx.fillRect(cx+i*7-2,94,4,5);
 }

 bctx.restore();
}

function press(k){
 if(S.mode==="end"){
  if(k==="z"||k==="enter"){
 sfx("select");
   location.reload();
  }

  return;
 }

 if(S.mode==="dialog")return;

 if(S.mode==="menu"){
  if(k==="arrowleft"||k==="a"){
   S.sel=(S.sel+3)%4;
  }

  if(k==="arrowright"||k==="d"){
   S.sel=(S.sel+1)%4;
  }

  if(k==="z"||k==="enter"){
   if(S.sel===0){
    viewBattle();
    S.mode="fight";
    fpos=0;
    fdir=1;
   }else if(S.sel===1){
    S.mode="magic";
    S.msel=0;
   }else if(S.sel===2){
    S.mode="item";
    S.isel=0;
   }else{
    doMercy();
   }
  }

  updHUD();
 }else if(S.mode==="magic"){
  if(k==="arrowleft"||k==="a"){
   S.msel=(S.msel+2)%3;
  }

  if(k==="arrowright"||k==="d"){
   S.msel=(S.msel+1)%3;
  }

  if(k==="z"||k==="enter")castMagic(S.msel);

  if(k==="x"||k==="escape"){
   S.mode="menu";
   updHUD();
  }
 }else if(S.mode==="item"){
  if(
   k==="arrowleft"||
   k==="a"||
   k==="arrowright"||
   k==="d"
  ){
   S.isel=(S.isel+1)%2;
  }

  if(k==="z"||k==="enter")useItem(S.isel);

  if(k==="x"||k==="escape"){
   S.mode="menu";
   updHUD();
  }
 }else if(S.mode==="fight"){
  if(k==="z"||k==="enter")doFight();
 }
}

function enterGame(){
 if(easterPlaying)return;
 audioOn();
 startReady=true;
 startMenu();
}

function handleStartClick(){
 if(!startReady){
  startReady=true;
  premise.style.display="block";
  startBtn.textContent="CONTINUE";
  return;
 }

 enterGame();
}

function resizeEasterCanvas(){
 easterCanvas.width=window.innerWidth;
 easterCanvas.height=window.innerHeight;
}

function drawStarField(now){
 var w=easterCanvas.width;
 var h=easterCanvas.height;

 easterCtx.fillStyle="#000";
 easterCtx.fillRect(0,0,w,h);

 for(var i=0;i<110;i++){
  var x=(i*137)%w;
  var y=(i*83)%h;
  var size=1+(i%3);
  var alpha=.25+.25*Math.sin(now*.002+i);

  easterCtx.fillStyle="rgba(255,255,255,"+alpha+")";
  easterCtx.fillRect(x,y,size,size);
 }
}

function drawRainbowHorn(ctx,x,y,angle,scale){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);
 ctx.scale(scale,scale);

 var g=ctx.createLinearGradient(-55,0,55,0);
 g.addColorStop(0,"#f00");
 g.addColorStop(.18,"#ff0");
 g.addColorStop(.36,"#0f0");
 g.addColorStop(.54,"#0ff");
 g.addColorStop(.72,"#08f");
 g.addColorStop(1,"#f0f");

 ctx.fillStyle=g;
 ctx.shadowColor="#fff";
 ctx.shadowBlur=18;

 ctx.beginPath();
 ctx.moveTo(58,0);
 ctx.lineTo(-36,-18);
 ctx.lineTo(-20,0);
 ctx.lineTo(-36,18);
 ctx.closePath();
 ctx.fill();

 ctx.strokeStyle="rgba(255,255,255,.7)";
 ctx.lineWidth=2;

 for(var i=-22;i<=22;i+=11){
  ctx.beginPath();
  ctx.moveTo(i,-15);
  ctx.lineTo(i+18,15);
  ctx.stroke();
 }

 ctx.restore();
}

function drawEasterPoisonBottle(ctx,x,y,angle,scale){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);
 ctx.scale(scale,scale);

 ctx.shadowColor="#6f6";
 ctx.shadowBlur=18;

 ctx.fillStyle="#ddd";
 ctx.strokeStyle="#fff";
 ctx.lineWidth=3;

 ctx.fillRect(-13,-42,26,14);
 ctx.strokeRect(-13,-42,26,14);

 ctx.beginPath();
 ctx.moveTo(-27,-27);
 ctx.lineTo(27,-27);
 ctx.lineTo(31,22);
 ctx.quadraticCurveTo(0,42,-31,22);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();

 ctx.fillStyle="#79ff72";
 ctx.beginPath();
 ctx.arc(0,8,18,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#333";
 ctx.lineWidth=4;
 ctx.beginPath();
 ctx.moveTo(-10,0);
 ctx.lineTo(10,20);
 ctx.moveTo(10,0);
 ctx.lineTo(-10,20);
 ctx.stroke();

 ctx.restore();
}

function playEasterEgg(){
 if(easterPlaying)return;

 easterPlaying=true;
 titleClicks=0;
 startScreen.style.display="none";
 document.getElementById("wrap").style.display="none";
 easterCanvas.style.display="block";
 resizeEasterCanvas();

 var started=performance.now();
 var collisionTime=720;
 var flashEnd=840;
 var circleEnd=1550;

 function frame(now){
  var elapsed=now-started;
  var w=easterCanvas.width;
  var h=easterCanvas.height;
  var centerX=w/2;
  var centerY=h/2;

  drawStarField(now);

  if(elapsed<collisionTime){
   var moveP=Math.min(1,elapsed/collisionTime);
   var ease=1-Math.pow(1-moveP,3);

   var hornStart=w+130;
   var hornEnd=centerX-42;
   var bottleStart=-130;
   var bottleEnd=centerX+42;

   var hornX=hornStart+(hornEnd-hornStart)*ease;
   var bottleX=bottleStart+(bottleEnd-bottleStart)*ease;

   var driftAmount=(1-moveP)*22;
   var hornY=
    centerY+
    Math.sin(elapsed*.018)*driftAmount;

   var bottleY=
    centerY+
    Math.cos(elapsed*.016)*driftAmount;

   drawRainbowHorn(
    easterCtx,
    hornX,
    hornY,
    elapsed*.018,
    1.12
   );

   drawEasterPoisonBottle(
    easterCtx,
    bottleX,
    bottleY,
    -elapsed*.018,
    1.08
   );
  }

  if(elapsed>=collisionTime&&elapsed<flashEnd){
   var flashP=
    (elapsed-collisionTime)/
    (flashEnd-collisionTime);

   var flashAlpha=1-flashP;

   easterCtx.fillStyle=
    "rgba(255,255,255,"+flashAlpha+")";

   easterCtx.fillRect(0,0,w,h);
  }

  if(elapsed>=collisionTime&&elapsed<circleEnd){
   var circleP=
    (elapsed-collisionTime)/
    (circleEnd-collisionTime);

   circleP=Math.min(1,circleP);

   var circleEase=
    1-Math.pow(1-circleP,3);

   var maxRadius=
    Math.sqrt(w*w+h*h)*.62;

   var radius=
    12+maxRadius*circleEase;

   var circleAlpha;

   if(circleP<.18){
    circleAlpha=circleP/.18;
   }else{
    circleAlpha=
     1-(circleP-.18)/.82;
   }

   circleAlpha=Math.max(0,circleAlpha);

   easterCtx.save();

   easterCtx.fillStyle=
    "rgba(255,255,255,"+circleAlpha+")";

   easterCtx.shadowColor="#fff";
   easterCtx.shadowBlur=45;

   easterCtx.beginPath();
   easterCtx.arc(
    centerX,
    centerY,
    radius,
    0,
    Math.PI*2
   );
   easterCtx.fill();

   easterCtx.restore();
  }

  if(elapsed<circleEnd){
   requestAnimationFrame(frame);
  }else{
   easterCtx.clearRect(
    0,
    0,
    easterCanvas.width,
    easterCanvas.height
   );

   easterCanvas.style.display="none";
   easterPlaying=false;
   startReady=true;
   startMenu();
  }
 }

 requestAnimationFrame(frame);
}

window.addEventListener("keydown",function(e){
 var k=e.key.toLowerCase();

 if([
  "arrowup",
  "arrowdown",
  "arrowleft",
  "arrowright",
  " "
 ].indexOf(k)>=0){
  e.preventDefault();
 }

 if(!keys[k]){
  keys[k]=true;
  press(k);
 }
});

window.addEventListener("keyup",function(e){
 keys[e.key.toLowerCase()]=false;
});

window.addEventListener("blur",function(){
 keys={};
 S.moving=false;
});

window.addEventListener("resize",function(){
 if(easterCanvas.style.display==="block"){
  resizeEasterCanvas();
 }
});

startBtn.addEventListener("click",function(){
 handleStartClick();
});

gameTitle.addEventListener("click",function(){
 if(easterPlaying)return;

 titleClicks++;

 if(titleClicks>=7){
  playEasterEgg();
 }
});

boss.addEventListener("mousedown",function(){
 if(S.mode==="end")return;

 S.clicks++;
 S.shake=.15;

 if(S.clicks>=40){
  endGame("click");
 }
});

document.querySelectorAll(".btn").forEach(function(el,i){
 el.addEventListener("click",function(){
  if(S.mode!=="menu")return;

  S.sel=i;
  press("z");
 });

 el.addEventListener("mouseenter",function(){
  if(S.mode==="menu"){
   S.sel=i;
   updHUD();
  }
 });
});

var last=performance.now();

function loop(now){
 var dt=Math.min((now-last)/1000,.05);
 last=now;

 update(dt);
 render();
 drawBoss();
 updHUD();

 requestAnimationFrame(loop);
}

startScreen.style.display="flex";
document.getElementById("wrap").style.display="none";
S.mode="start";
requestAnimationFrame(loop);
</script>
</body>
