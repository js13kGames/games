<html><head><title>JS13kGame: My Little Armaggedon!</title><style>*{--bg:#999;--bgLite:#ccc;--bgDark:#666;margin:0;padding:0;font-family:'Courier New',monospace;user-select:none;font-smooth:none}body{background-color:#000;display:flex;align-items:center;justify-content:center}h1{font-size:72px;font-weight:bolder;text-align:center;animation:rainbow 4s linear infinite;margin-top:200px}#credits{text-align:center;margin-top:100px}a{animation:rainbow 4s linear infinite}@keyframes rainbow{0%{color:#ff5}33%{color:#5ff}66%{color:#f5f}100%{color:#ff5}}#lobby,#match,#title{position:absolute;color:#fff;width:100%;height:100%;transition:opacity .88s ease,display .88s ease allow-discrete;top:0;opacity:1;z-index:99}#accept-invite{position:absolute;background-color:rgba(0,0,0,.4);color:#fff;width:100%;height:100%;z-index:999}#accept-invite .menu{margin:auto;position:relative;width:fit-content;text-align:center;margin-top:372px}.sub{text-align:center}#global{position:absolute;top:0;right:0;z-index:999}#toggle-audio{font-size:36px;padding:8px}#wrapper{position:relative;width:1080px;height:600px;flex:none;overflow:hidden}.hidden{display:none}h2{margin-bottom:12px;margin-top:12px}.menu{position:absolute;border:6px solid #666;background-color:rgba(188,188,188,.88);padding-left:10px;padding-right:10px}#picker{margin-top:20px;margin-left:110px}#lobby-owner{position:absolute;margin-top:20px;width:100%;text-align:center;color:#000}#invite{margin-top:172px;margin-left:960px}input,input:active,input:focus,select,select:active,select:focus{border:2px outset #000;background-color:var(--bg);padding:3px;outline:0}input:invalid,input:user-invalid{background-color:var(--bgDark)}.i-g{width:100%;margin-bottom:12px}#baseColor,#name{width:120px}#start-match{margin:auto;font-size:32px;margin-top:440px;display:block}button:hover{outline:6px solid var(--bgDark);border:12px outset var(--bgLite)}button:active{outline:6px solid var(--bgDark);border:12px inset var(--bgDark);background-color:var(--bg);transform:translateY(4px)}button{color:#333;background-color:var(--bg);padding:12px;opacity:.88;border:12px outset var(--bg);outline:6px solid #000;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;font-weight:700}.green{--bg:#090;--bgDark:#060;--bgLite:#0c0;color:#fff}.red{--bg:#900;--bgDark:#600;--bgLite:#c00;color:#fff}#angleometer,#current-weapon{font-size:18px;font-weight:700;text-align:center;background-color:rgba(255,255,255,.1);border:3px inset grey;width:26px;float:left;padding:12px}#match label{position:absolute;width:60px}#picker label{width:60px;display:block;float:left;margin-top:5px}#angleometer label{margin-left:15px}#fuelometer label,#speedometer label{margin-left:-25px;margin-top:5px}canvas{image-rendering:pixelated;position:absolute;top:0;left:0;width:1080px;height:600px;display:block}#bottom-hud{bottom:0;position:absolute;height:100px;background-color:rgba(128,128,128,.9);width:calc(100% - 24px);border:2px solid #000;padding:10px}#fuelometer,#speedometer{width:75%;border:2px solid #000;margin:10px auto;height:30px;background-color:#333}#current-speed{background-color:#8b0000;border:4px #8b0000 inset;height:22px}#last-shot{color:#8b0000;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;position:relative;margin-top:-46px}#current-fuel{background-color:#00008b;border:4px #00008b inset;height:22px}#total{top:0;position:absolute;height:52px;width:100%;color:#000;text-align:left;color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}#game-over{display:none}#current-weapon{position:absolute;right:20px;bottom:20px;width:50px;padding:12px}#next-weapon{position:absolute;right:0;bottom:36px}#prev-weapon{position:absolute;right:52px;bottom:36px}#current-ammo{font-size:12px;padding-top:10px}#announcer{display:none;position:absolute;z-index:999;animation:toast 3s forwards;top:100px;left:0;font-size:48px;color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;width:100%;text-align:center}.mini-toast{display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:rgba(0,200,0,.7);color:#fff;padding:16px 0;border-radius:4px;font:18px sans-serif;font-weight:700;text-align:center;width:100%;white-space:nowrap;animation:toast 3s forwards}@keyframes toast{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}</style></head><body><div id="global"><button id="toggle-audio">&#x1F507;</button></div><div id="accept-invite" class="hidden"><div class="menu"><h2>JOIN MATCH?</h2><button id="join" class="green">YES!</button><button id="decline" class="red">DECLINE</button></div></div><div id="wrapper"><div id="title"><h1>MY LITTLE ARMAGEDDON</h1><div class="sub">(click anywhere to start)</div><div id="credits">A 13kb Javascript game by <a href="https://github.com/fed135" target="_blank" onclick="event.stopPropagation()">Frederic Charette</a></div></div><canvas id="canvas">Oops...</canvas><div id="lobby" class="hidden"><div id="lobby-owner" class="hidden"></div><div id="picker" class="menu"><h2>CUSTOMIZE</h2><div class="i-g"><label>NAME:</label><input id="name" value="Player" required placeholder="Type a name!" oninput="window.updateName(event)"></div><div class="i-g"><label>COLOR:</label><input id="baseColor" type="color" oninput="window.updateColor(event)" value="#ffffff"></div></div><div id="invite" class="menu hidden"><h2>INVITE YOUR FRIENDS</h2><input type="hidden" id="invite-link"><button id="copy-link">COPY INVITE LINK</button><div class="mini-toast" onanimationend='this.style.display="none"'>COPIED!</div></div><button id="start-match">START MATCH</button></div><div id="match" class="hidden"><div id="announcer"></div><div id="total"></div><div id="bottom-hud"><div id="angleometer"><label>&#x1F4D0;</label><div id="current-angle"></div></div><div id="speedometer"><label>&#x1F50B;</label><div id="current-speed"></div><div id="last-shot">&#9660;</div></div><div id="fuelometer"><label>&#x1F40E;</label><
