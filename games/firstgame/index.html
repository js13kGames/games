<!DOCTYPE html> <html> <head><title>FirstGame - js13kGames 2017</title> <meta name="viewport" content="width=device-width,initial-scale=1"> <style>canvas{margin-left:calc((100% - 720px)/ 2);border:1px solid #d3d3d3;background-color:#f1f1f1}.info{padding:10px;text-align:center}</style> </head> <body onload="startGame()"> <script>var myGamePiece,myScore,myObstacles=[];function startGame(){(myGamePiece=new component(30,30,"assests/ball.png",10,120,"image")).gravity=.05,myScore=new component("30px","Consolas","black",280,40,"text"),myGameArea.start()}var myGameArea={canvas:document.createElement("canvas"),start:function(){this.canvas.width=720,this.canvas.height=400,this.context=this.canvas.getContext("2d"),document.body.insertBefore(this.canvas,document.body.childNodes[0]),this.frameNo=0,this.interval=setInterval(updateGameArea,20)},clear:function(){this.context.clearRect(0,0,this.canvas.width,this.canvas.height)}};function component(width,height,color,x,y,type){this.type=type,"image"==type&&(this.image=new Image,this.image.src=color),this.score=0,this.width=width,this.height=height,this.speedX=0,this.speedY=0,this.x=x,this.y=y,this.gravity=0,this.gravitySpeed=0,this.bounce=.6,this.update=function(){ctx=myGameArea.context,"image"==type?ctx.drawImage(this.image,this.x,this.y,this.width,this.height):"text"==this.type?(ctx.font=this.width+" "+this.height,ctx.fillStyle=color,ctx.fillText(this.text,this.x,this.y)):(ctx.fillStyle=color,ctx.fillRect(this.x,this.y,this.width,this.height))},this.newPos=function(){this.gravitySpeed+=this.gravity,this.x+=this.speedX,this.y+=this.speedY+this.gravitySpeed,this.y<2&&(this.y=0,accelerate(.1)),this.x<0&&(this.x=1),this.hitBottom()},this.hitBottom=function(){var rockbottom=myGameArea.canvas.height-this.height;this.y>rockbottom&&(this.y=rockbottom,this.gravitySpeed=-this.gravitySpeed*this.bounce)},this.crashWith=function(otherobj){var myleft=this.x,myright=this.x+this.width,mytop=this.y,mybottom=this.y+this.height,otherleft=otherobj.x,otherright=otherobj.x+otherobj.width,othertop=otherobj.y,otherbottom=otherobj.y+otherobj.height,crash=!0;return(mybottom<othertop||mytop>otherbottom||myright<otherleft||myleft>otherright)&&(crash=!1),crash}}function updateGameArea(){var x,height,gap;for(i=0;i<myObstacles.length;i+=1)if(myGamePiece.crashWith(myObstacles[i]))return;for(myGameArea.clear(),myGameArea.frameNo+=1,(1==myGameArea.frameNo||everyinterval(150))&&(x=myGameArea.canvas.width,height=Math.floor(181*Math.random()+20),gap=Math.floor(151*Math.random()+50),myObstacles.push(new component(40,height,"assests/pipe.png",x,0,"image")),myObstacles.push(new component(40,x-height-gap,"assests/pipe.png",x,height+gap,"image"))),i=0;i<myObstacles.length;i+=1)myObstacles[i].x+=-1,myObstacles[i].update();myScore.text="SCORE: "+myGameArea.frameNo,myScore.update(),myGamePiece.newPos(),myGamePiece.update()}function everyinterval(n){return myGameArea.frameNo/n%1==0}function moveleft(){myGamePiece.speedX-=1}function moveright(){myGamePiece.speedX+=1}function stopMove(){myGamePiece.speedX=0}function accelerate(n){myGamePiece.gravity=n}function restart(){location.href=""}document.onkeydown=function(evt){switch((evt=evt||window.event).keyCode){case 37:moveleft();break;case 38:accelerate(-.2);break;case 39:moveright();break;case 40:accelerate(.05)}},document.onkeyup=function(evt){accelerate(.05)}</script> <br> <div class="info"> <button onmousedown="accelerate(-.2)" onmouseup="accelerate(.05)">ACCELERATE</button> <button onmousedown="moveleft()" onmouseup="stopMove()" ontouchstart="moveleft()">LEFT</button> <button onmousedown="moveright()" onmouseup="stopMove()" ontouchstart="moveright()">RIGHT</button> <button onclick="restart()">Restart Game</button> <p>Use the Keys or buttons to ACCELERATE the lost ball so that it can reach its destination. </p> </div> </body> </html>
