<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <title>Unicorn Sticker Lab</title>
<link rel="stylesheet" href="index-5ZTP2BGY.css"></head>
<body>
    <canvas id="bgDrift"></canvas>
    <div id="app">
        <div id="header">
            <span id="discoveryCount"></span>
            <button id="collectionBtn">Collection</button>
            <button id="albumBtn">Album</button>
            <button id="muteBtn" title="Mute music">♪</button>
        </div>
        <div id="request"></div>
        <div id="stage">
            <canvas id="mascot" title="Your studio mascot"></canvas>
            <canvas id="c"></canvas>
            <div id="toast"></div>
        </div>
        <div id="printRow">
            <button id="printBtn" title="Print your sticker - combines overlapping pieces, clears the rest">Sticker it!</button>
            <button id="clearBtn" title="Clear the whole canvas">Bye!</button>
        </div>
        <div id="toolbar">
            <button class="edit-only" data-act="rotL" title="Rotate left">↺</button>
            <button class="edit-only" data-act="rotR" title="Rotate right">↻</button>
            <button class="edit-only" data-act="scaleDown" title="Smaller">−</button>
            <button class="edit-only" data-act="scaleUp" title="Bigger">+</button>
            <button class="edit-only" data-act="flip" title="Flip">⇆</button>
            <button class="edit-only" data-act="back" title="Send back">⇓</button>
            <button class="edit-only" data-act="front" title="Bring forward">⇑</button>
            <button class="edit-only" data-act="dup" title="Duplicate">⧉</button>
            <button data-act="del" title="Delete">✕</button>
        </div>
        <div id="colors"></div>
        <div id="effects"></div>
        <div id="tray"></div>
        <div id="collection" class="hidden">
            <div id="collectionPanel">
                <button id="collectionClose" title="Close">✕</button>
                <h1>Collection</h1>
                <div id="collectionList"></div>
                <button id="resetBtn" title="Erase every discovered recipe and unlocked piece">Reset Progress</button>
            </div>
        </div>
        <div id="album" class="hidden">
            <div id="albumPanel">
                <button id="albumClose" title="Close">✕</button>
                <h1>Album</h1>
                <div id="albumGrid"></div>
                <div id="albumDetail" class="hidden">
                    <canvas id="albumDetailCanvas"></canvas>
                    <span id="albumDetailName"></span>
                    <div id="albumDetailButtons">
                        <button id="albumExport">Save Image</button>
                        <button id="albumDelete">Delete</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="confirm" class="hidden">
            <div id="confirmPanel">
                <p id="confirmText"></p>
                <div id="confirmButtons">
                    <button id="confirmYes">Yes</button>
                    <button id="confirmNo">No</button>
                </div>
            </div>
        </div>
        <div id="title">
            <canvas id="titleCanvas" width="280" height="170"></canvas>
            <h1>Unicorn Sticker Lab</h1>
            <p>Drag pieces together, then tap Sticker it! to combine them.</p>
            <button id="startBtn">Start</button>
        </div>
    </div>
