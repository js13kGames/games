<!doctype html><title>Toe Tac Tic</title><meta name="monetization" content="$coil.xrptipbot.com/8wCYXpSjRJ67qwDLasYc3g"><link rel="stylesheet" href="style.css"><div class="wrapper"><h1>Rules</h1><p style="font-size:2em">1) You can only place X in this game</p><p style="font-size:2em">2) If you make 3-X in a row or column or diagonally you loose the game</p><p style="font-size:2em">3) This is a offline game so the opponent/friend should be sitting with you to play the game</p><button onclick="begin()" style="margin:30vh 46%">Start</button></div><h1>Toe-Tac-Tic</h1><table><tr><td class="cell" id="0"></td><td class="cell" id="1"></td><td class="cell" id="2"><tr><td class="cell" id="3"></td><td class="cell" id="4"></td><td class="cell" id="5"><tr><td class="cell" id="6"></td><td class="cell" id="7"></td><td class="cell" id="8"></td></tr></td></tr></td></tr></table><div class="endgame"><div class="text"></div></div><button onclick="startGame()">Replay</button><script>var origBoard;const huPlayer="X",aiPlayer="X",winCombos=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[6,4,2]],cells=document.querySelectorAll(".cell");function startGame(){document.querySelectorAll("td").forEach(td=>td.style.color="white"),document.querySelector(".endgame").style.display="none",origBoard=Array.from(Array(9).keys());for(var i=0;i<cells.length;i++)cells[i].innerText="",cells[i].style.removeProperty("background-color"),cells[i].addEventListener("click",turnClick,!1)}function turnClick(square){"number"==typeof origBoard[square.target.id]&&turn(square.target.id,"X")}function turn(squareId,player){origBoard[squareId]=player,document.getElementById(squareId).innerHTML=player;let gameWon=checkWin(origBoard,player);gameWon&&gameOver(gameWon)}function checkWin(board,player){let plays=board.reduce((a,e,i)=>e===player?a.concat(i):a,[]),gameWon=null;for(let[index,win]of winCombos.entries())if(win.every(elem=>plays.indexOf(elem)>-1)){gameWon={index:index,player:player};break}return gameWon}function gameOver(gameWon){for(let index of winCombos[gameWon.index])document.getElementById(index).style.backgroundColor=(gameWon.player,"white");for(var i=0;i<cells.length;i++)cells[i].removeEventListener("click",turnClick,!1);declareWinner("X"==gameWon.player?"Player 1 won":"Player 2 won")}function declareWinner(who){document.querySelector(".endgame").style.display="block",document.querySelector(".endgame .text").innerText=who,document.querySelectorAll("td").forEach(td=>td.style.color="black")}function checkTie(){if(0==emptySquares().length){for(var i=0;i<cells.length;i++)cells[i].style.backgroundColor="lightgreen",cells[i].removeEventListener("click",turnClick,!1);return declareWinner("Tie Game!"),!0}return!1}function begin(){document.querySelector(".wrapper").style.display="none"}startGame()</script>
