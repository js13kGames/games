    class Timer{
    constructor(t){
        this.start = t;
        this.time = t;
        this.enabled = t>0;
    }

    Set(t){
        this.time = t;
        this.enabled = t>0;
    }
    Update(dt){
        var r = false;
        if(this.enabled){
            this.time -= dt;

            if(this.time <= 0)
            {
                this.time = 0;
                this.enabled = false;
                r = true;
            }
        }
        return r;
    }
}

class KeyInput{
    
    static pres = [];//pressed
    static rel = [];//released

    static IsDown(k1, k2) {
        return this.pres[k1] || this.pres[k2];
    }

    static IsSingle(key) {
        var k = this.pres[key] && (this.rel[key] !== null || this.rel[key]);
        if(k){
            this.rel[key] = null;
        }
        return k;
    }
    
    static Pressed(e, status) {
        var k = this.SetKey(e);
        this.pres[k] = status;
        return k;
    }

    static Released(e, status) {
        var k = this.SetKey(e);
        this.rel[k] = status;
    }

    static SetKey(event) {
        return event.key;
    }
}

class GamePad extends KeyInput{
    static pads = () => (navigator.getGamepads ? Array.from(navigator.getGamepads()) : []).filter(x => !!x);

    static bpres = [];
    static meta = [
        {i:1,v:-1,b:12},
        {i:1,v:1,b:13},
        {i:0,v:-1,b:14},
        {i:0,v:1,b:15}];

    static Btn(i, p, h) {
        const pads = this.pads();        
        try {
            var s = pads[p].buttons[i].pressed;
            var d = (h&&s) || (s && (this.bpres[i+10] != s));
            this.bpres[i+10] = s;
            return d;
        } catch (e) {}
    };

    static Joy(p, i, h){
        var m = this.meta[i];
        var s = this.Pad(m.i,m.v, p) || this.Btn(m.b, p, h);
        var d = (h&&s) || (s && (this.bpres[i] != s));
        this.bpres[i] = s;
        return d;
    }

    static Pad (i, v, p) {
        const pads = this.pads();
        try {
            if (Math.abs(v - pads[p].axes[i]) < 0.5) {
                return true;
            }
        } catch (e) {}
    };

    static Pads(){
        return this.pads();
    }
}

class TouchPad extends GamePad{
    static TouchEnabled = false;
    static tpres = [];

    static zones = [
        {x:0, t:200},
        {x:700,t:900},
        {x:201, t:699}];
    
    static press = [];

    static Init(canvas, enabled, rend){//, b2){
        this.TouchEnabled = enabled;
        this.rend = rend;

        var m = this;
        var TouchMove = function(e){
            e.preventDefault();
            if (e.touches) {
                var rect = canvas.getBoundingClientRect(); // abs. size of element
                m.press = [];
                for (var i = 0; i < e.touches.length; i++) {
                    var touch = e.touches[i];
                    m.press.push({e:1,
                        x:Math.round((touch.pageX - rect.left)*(canvas.width / rect.width)),
                        y:Math.round((touch.pageY - rect.top)*(canvas.height / rect.height))});
                }
                
            } 
        }

        var TouchEnd = function(e){
            e.preventDefault();
            m.press = [];
        }

        canvas.addEventListener("touchstart", TouchMove);
        canvas.addEventListener("touchmove", TouchMove);
        canvas.addEventListener("touchend", TouchEnd);
        canvas.addEventListener("touchcancel", TouchEnd);
    }

    static Touched(i) {
        var s = this.Touch(i);
        var d = s && (this.tpres[i] != s);
        this.tpres[i] = s;
        return d;
    }

    static Touching(i) {
        var s = this.Touch(i);
        this.tpres[i] = s;
        return s;
    }

    // static Any() {
    //     return this.press.length > 0;
    // }

    static Touch(indx) {
        for (var i = 0; i < this.press.length; i++) {
            var p = this.press[i];
            var z = this.zones[indx];
            console.log(p.x,z.x,z.t);
            return p.x > z.x && p.x < z.t;
        } 
        return 0;
    }
}

class Input extends TouchPad{

    static LeftS(){return this.Touched(0) || this.IsSingle('a') || this.IsSingle('ArrowLeft') || this.Joy(0,2,0)}
    static RightS(){return this.Touched(1) || this.IsSingle('d') || this.IsSingle('ArrowRight') || this.Joy(0,3,0)}
    static Space(){return this.Touched(2) || this.IsSingle(' ') || this.Btn(0,0)}
}
