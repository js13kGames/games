st.onclick=()=>{

      document.fonts.add(y);
      z=new FontFace('cursive','url(https://xem.github.io/ttf/C.ttf)');

        document.fonts.add(z);
        go();
      })
    })
  }
  else{
    setTimeout(go,200);
  }
}
