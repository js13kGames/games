 anything strange?","He walked off the stage a couple of times.","Where were you sitting?","At the counter. I can see the whole room from here.","Did you see Bruce leave the door?","Once, right after the noise. He was away ten seconds. Too short to steal anything.","Did you see who took it?","No. But Jazz took his case off the stage while his saxophone was still there.")]},{num:2,title:"MOTEL",npcs:[A("Martha",0,"Another quiet night at the Frozen Pines. Or it was.","Who else was awake?","Hank in the basement, Vince in Room 1, Chloe in Room 2, Rosa in the laundry.","Did anyone come in?","The lobby is connected to the staff hallway.","Do you trust your staff?","Mostly. But Hank needs money.","When did you notice the color was gone?","Around 10:45 PM."),A("Rosa",0,"The laundry never ends, even at midnight.","Was Hank with you?","No. I was alone from 10:00 to 11:00 PM.","What did you hear?","A heavy staff door closed loudly around 10:30 PM.","Did you see any guests?","No. The basement has no windows.","Did you see Hank come down?","I never saw him in the basement."),A("Hank",1,"This place breaks down without me. Boiler, pipes, everything.","Did you go upstairs?","No, I never left the basement.","Did you see anything strange?","Yes, Vince. Walking quietly around the lobby at 10:30 PM.","Who took the color?","Vince, for sure. He looks like a thief.","Can anyone confirm you were here?","Rosa was working. Ask her."),A("Vince",0,"You don't look like you want a room. What is it?","Could you see the lobby?","Yes, the big lobby window was right in front of me.","Did you go inside?","No. I never went in.","Did you see anyone inside?","I saw Hank walking out with a big heavy bag.","What time was that?","Around 10:30 or 10:45. I'm not sure."),A("Chloe",0,"Finally. I have been awake for over an hour.","Did you hear anything?","Something heavy fell in the lobby. It woke me up.","Did you look outside?","Yes. I saw Vince in the car park, smoking.","Did Vince go inside?","No, he stayed outside the whole time.","What time did you hear the noise?","Late, around 10:30.")]},{num:3,title:"GAS STATION",npcs:[A("Earl",0,"Evening. Is something wrong?","Where were you when it went missing?","In the shop, counting the money.","Did you see who took it?","No. I can't see the pumps from my seat.","Did you hear anything strange?","The garage door made a loud noise. It only does that when someone opens it.","Who was in the garage?","Only Rusty. He was repairing an engine late."),A("Sally",0,"I was trying to sleep in my car.","What happened?","I was asleep in the car. A loud noise woke me up.","Did you see anyone running?","I lost my glasses, so everything was a blur. A man in a dark shiny jacket ran past.","Are you sure it was leather?","It was dark and it shone. It must have been Leo over there.","Was he carrying anything?","Something in his hand. Without my glasses I couldn't see what."),A("Leo",0,"Just filling my tank. Nothing else.","Where were you?","At the pump, filling my motorcycle.","Did you run past Sally's car?","No. And I have no leather jacket. This is a clean cloth vest.","Did you see the thief?","A man in dark work clothes with oil on them, moving quietly past the pumps.","Did he leave anything?","He dropped a heavy metal wrench on the ground while he ran."),A("Dexter",0,"I'm just having a snack here.","Where were you standing?","By the vending machines, eating a sandwich.","Did Leo do anything?","No. Leo stood by his motorcycle the whole time.","Anyone else?","Rusty came out of the garage and looked around nervously.","Was he carrying anything?","A big wrench, right there in his hand."),A("Rusty",1,"I was in the garage all night. A long job.","Where were you when it was taken?","In the garage with a broken engine. I never left it.","Earl heard the garage door open.","Probably the wind. I didn't go outside once.","Did you drop a wrench by the pumps?","No. All my tools are right here. I don't know what you mean.","Then who took it?","Leo, probably. He looks like a thief to me.")]},{num:4,title:"BRIDGE",npcs:[A("Hugo Crane",1,"The bridge is closed. Workers only.","Where were you all night?","In my hut by the gate. All night. I never went outside.","The east gate record says it opened at 2 AM.","The wind. That lock is older than me.","There is fresh paint on your sleeve.","I painted the safety rails yesterday. Normal work.","Then who took it?","The fisherman. Mick is under my bridge every night and nobody checks him."),A("Mick Dell",0,"Fishing all night, like always.","Did Hugo leave his hut?","Twice. Around midnight, and again close to two.","Where did he go?","To the signal tower on the far bank. He has the only key.","Was he carrying anything?","Something wrapped in cloth. He went up with it and came back with empty hands.","Hugo says you are the thief.","My lamp was on all night. Walt can see my boat from the toll gate."),A("Sonia Mace",0,"I crossed at 2:15. The gate was open, but it should have been locked.","Did you see anyone?","A dark figure climbing down to the water. I thought it was the fisherman.","How well did you see them?","Not well. Thick fog, and I was driving. I only saw a coat.","What about the keeper's hut?","Dark inside. Hugo was there, but he turned his face away when I slowed down.","Is the hut ever dark?","Never. There is a light every night. I have crossed here for six years."),A("Walt Vane",0,"Toll gate. I see everyone who crosses.","Was Mick in his boat all night?","His lamp was on from evening to morning. He never left the water.","And Hugo?","His hut was dark from two until twenty past. That never happens.","Did you see him on the bridge?","He walked to the far end with something. He didn't come back that way.","Did you see anything on the rail?","A sticky mark on the east rail. It was still wet when I touched it this morning."),A("Iris Cole",0,"I check this bridge every morning. Today something was wrong.","What did you find?","A sticky mark on the tower door. Only the keeper has that key.","Hugo says he painted the rails.","Then show me one. I walked the whole bridge and found no new paint.","Could the paint be old?","It was still wet when he shook my hand at seven. Old paint dries by morning.","So he lied to me.","He never lied to me before. That is what worries me.")]},{num:5,title:"DINER",npcs:[A("Peg Flynn",1,"The kitchen is closed. Order at the counter.","Were you here after closing time?","I left at eleven. Vera closed up without me.","There is a stain on your apron.","Berry jam. We had a special pie last night.","There is no pie on the menu.","It's not on the menu. Only for regular guests. You wouldn't know.","Then who took it?","That homeless man by the window. Otto sits there every night and never orders anything."),A("Vera Holt",0,"The corner table is mine after work. I saw the whole night.","Who closed the diner?","I did, at two. Peg was still in the kitchen at half past one.","Peg says she left at eleven.","Then Peg is lying. I saw her leave by the back door at two with a box.","What was in it?","Light came through the gaps in the box. Cold light. Not a lamp.","Could Otto get into the kitchen?","He never left his table. I filled his coffee four times between midnight and two."),A("Otto Black",0,"Window seat. The best view here, and it costs nothing.","What did you see?","Light from the kitchen vents about half past one. That was not light from a cooker.","Was the cook still there?","Peg was in there after midnight. The cold room door opened twice.","Peg says you took it.","I haven't been behind that counter in nine years. Ask Vera who poured my coffee.","Did you see Peg leave?","By the back door, about two, with a box. I thought it was the rubbish."),A("Frank Lime",0,"Regular guests don't talk about each other. But this is different.","Did you see anyone at the back door?","A person in a long coat, about two. Otto wears a long coat.","How sure are you?","Not sure at all. Heavy rain, and I was across the road at the bus stop.","Anything else that night?","Peg was nervous from midday. She kept looking out of the back window.","When did you leave?","Midnight. Her car was still in the car park when I passed at two."),A("Cass Wren",0,"Morning shift. I opened the cold room and something was wrong.","Wrong how?","Ice in a circle on the back wall. Food doesn't freeze in a circle.","Who has a key to the cold room?","Peg. Only Peg. I have asked for one for two years.","She says the stain is berry jam.","We had no berries for three weeks. I sign for every box myself.","So there was no special pie.","There was no pie at all.")]},{num:6,title:"FOREST",npcs:[A("Gus Thorn",1,"The trail is closed. Fire danger. You should go back.","Where were you last night?","In the east area, the whole shift. Nothing to report.","The east record book is empty.","The radio was down. I wrote my report by hand later.","Footprints lead to your cabin.","Trail paint. I painted the fences again yesterday afternoon.","Who else was in the forest?","That walker, Rook. No permit, and he is out here every night. Ask him why."),A("Rook Pine",0,"I walk the east trail every night. Eleven years now.","Was Gus on the east trail?","No. The path is narrow. You can't pass a man without touching him.","Then where was he?","By the radio tower about one, going north to his own cabin.","Gus says you took it.","My head lamp was on the east trail all night. Drew watches it from the tower.","Did you go near the tower?","Never. The door is locked and I have no reason to go up."),A("Nora Elm",0,"The birds went quiet after midnight. That always means something.","What did you hear?","Heavy steps in the north trees. A big man carrying something heavy.","Could you see them?","No. I sit in a small hut in the dark. I heard it and thought of the walker.","Why the walker?","Habit. He is the only person I meet there. But all boots sound the same.","When did the birds calm down?","At sunrise. Whatever scared them was gone by then."),A("Drew Fern",0,"Fire tower. My job is to watch this forest in the dark.","Could you see the east trail?","Rook's head lamp, eleven to three. He never turned north.","And the radio tower?","A light at the bottom about one. A metal box on the ground, a man above it.","Could you see who?","A ranger coat. Rook wears a bag and a hood. It was not him.","Anything strange in the book?","Gus wrote last night in pencil. Every other note is in pen."),A("Isla Birch",0,"Dawn shift. Four years here and I never saw this before.","Saw what?","A sticky mark on the lower door of the radio tower. Still wet at sunrise.","Who can open that door?","Rangers. That is the whole list, and one of them worked last night.","Gus says he painted the fences.","I walked past every fence on the north loop. Not one new mark.","And his report?","Pencil, and the times don't match the radio tape. He kept away from that tower.")]},{num:7,title:"POLICE",npcs:[A("Chief Ward",1,"This floor is closed to visitors. What do you want?","You entered the evidence room at midnight.","A normal check. I may enter every room here.","You haven't done a night check for two years.","Then it was late. Is that your question?","The seal on box seven is broken.","It broke on the way here. That happens more often than people think.","Who else had a key?","Reeve. The new officer had an evidence key that week. Start there."),A("Sgt. Dunn",0,"Front desk. Nobody reaches the evidence room without passing me.","Who signed in last night?","Chief Ward. In at 12:08, out at 1:30. I signed him in myself.","Is that normal for him?","He hasn't done a night check since I became a sergeant.","What was he carrying out?","A small black case with light at the edge. And no papers for it.","Ward says Reeve had a key.","Reeve gave that key back on Friday. It's in my book, signed and dated."),A("Capt. Marsh",0,"I don't talk about senior officers. But I wrote a report.","When did you last check box seven?","Six in the evening. The seal was fine. I checked it myself.","And this morning?","Broken. I reported it and Ward told me to hold the report.","Did you see anyone in the corridor?","A young officer about one. Reeve, I thought. Far away, and the lights were low.","Could you be wrong?","Reeve and Cole are the same size in the same uniform. At that distance, easily."),A("Off. Reeve",0,"The chief asked me not to talk about last night.","That is exactly why I am asking.","My evidence key went back to Dunn on Friday. It's in his book.","Where were you at one?","On a call across town. The radio tape has all of it.","Did you see Ward?","He came out of the evidence room with a closed case. He never looked at me.","Was it written down?","Nothing leaves that room without papers. There were none."),A("Off. Cole",0,"Night shift. I heard it before I saw anything.","Heard what?","One person walking in the evidence corridor after midnight. One, not two.","Are you sure it was one?","That corridor echoes. Two people sound nothing like one.","Marsh thinks he saw Reeve.","Reeve was across town on a call from twelve to two. The tape shows it.","So who was in the corridor?","Ward signed in alone at 12:08, and out at 1:30.")]}],D=[[[158,15],[78,84],[190,66],[86,128],[80,35]],[[120,18],[56,132],[176,130],[48,71],[164,71]],[[52,70],[174,84],[124,76],[52,104],[192,126]],[[75,50],[50,128],[120,52],[165,130],[210,66]],[[24,132],[120,42],[166,58],[70,42],[54,120]],[[196,120],[140,60],[62,120],[100,30],[48,78]],[[30,72],[120,18],[214,128],[60,100],[142,72]]],M=[[120,132],[120,88],[96,128],[120,130],[120,60],[120,130],[96,96]],P=[[20,8,200,18],[20,8,200,18],[20,8,200,18],[58,22,34,38],[20,8,200,18],[166,88,52,44],[20,8,200,18]];class H extends r{constructor(e,t,o){super(),this.cfg=e,this.onWin=t,this.onLose=o,this.dialog=null,this._player=null,this._nearNpc=null,this.bg="#080808",this._build()}_build(){const e=this.cfg.num;this.camera.zoom=3;const t=(e,t,o,n)=>{const s=new l(e,t);s.add(new a(o,n,{kind:"solid"})),this.add(s)};t(0,0,4,150),t(236,0,4,150),t(0,0,2
