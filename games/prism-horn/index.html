<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
    <title>PRISM HORN</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        margin: 0;
        background: #05000c;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        font-family: Impact, "Arial Black", sans-serif;
        touch-action: none;
        user-select: none;
      }
      canvas {
        display: block;
        width: min(100vw, 150vh);
        height: min(100vh, 66.6667vw);
        outline: none;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="640" aria-label="PRISM HORN arcade game"></canvas>
    <script src="game.js"></script>
  </body>
</html>
