function sfx(t){if(t=='tap')tone(620,.04,.025,'square');else if(t=='swap'){tone(420,.05,.03);tone(520,.06,.02,'triangle',.03)}else if(t=='bad')tone(190,.1,.03,'sawtooth');else if(t=='pop')tone(560+Math.random()*160,.05,.025,'triangle');else if(t=='tool')[740,980,1240].forEach((f,i)=>tone(f,.07,.03,'square',i*.03));else if(t=='rush')[520,660,820,980,1180].forEach((f,i)=>tone(f,.09,.035,'triangle',i*.04));else if(t=='win')[520,660,780,1040,1320].forEach((f,i)=>tone(f,.12,.04,'triangle',i*.06));else if(t=='lose')[480,420,350].forEach((f,i)=>tone(f,.14,.03,'sine',i*.08))}

function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b1452');g.addColorStop(.45,'#29307b');g.addColorStop(1,'#101a42');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<26;i++){let a=(i*41+7)%W,y=(i*i*17)%Math.max(180,H*.28),r=i%5?2:3;x.fillStyle=`rgba(255,255,255,${i%5?'.22':'.45'})`;x.beginPath();x.arc(a,y,r,0,7);x.fill()}x.lineCap='round';for(let i=0;i<7;i++){x.strokeStyle=cols[i]+'55';x.lineWidth=Math.max(10,H*.018)-i*.4;x.beginPath();x.arc(W/2,H*.42,Math.min(W,H)*.42-i*14,3.65,5.77);x.stroke()}for(let i=0;i<5;i++){let a=W*.08+i*W*.18,b=H*.12+(i%2)*18;x.fillStyle='#fff3';rr(a,b,68,24,16);x.fill();x.beginPath();x.arc(a+18,b+12,14,0,7);x.arc(a+34,b+8,18,0,7);x.arc(a+50,b+12,14,0,7);x.fill()}if(flash){x.fillStyle=`rgba(255,255,255,${flash/12})`;x.fillRect(0,0,W,H);flash--}}
function gem(t,r,c){let px=X+c*S,py=Y+r*S,m=S/66;if(t.c<0){x.fillStyle='#6e7690';rr(px+5*m,py+7*m,56*m,50*m,18*m);x.fill();x.fillStyle='#a8afc2';for(let i=0;i<3;i++){x.beginPath();x.arc(px+(18+i*12)*m,py+(31+(i&1?5:0))*m,9*m,0,7);x.fill()}x.fillStyle='#ffffff44';rr(px+18*m,py+18*m,18*m,6*m,4*m);x.fill();return}let g=x.createRadialGradient(px+21*m,py+18*m,4*m,px+30*m,py+28*m,30*m);g.addColorStop(0,'#fff');g.addColorStop(.25,cols[t.c]);g.addColorStop(1,'#00000022');x.fillStyle=g;rr(px+4*m,py+4*m,S-8*m,S-8*m,18*m);x.fill();x.fillStyle='#ffffff66';rr(px+14*m,py+11*m,20*m,8*m,4*m);x.fill();x.strokeStyle='#fff4';x.lineWidth=2*m;rr(px+7*m,py+7*m,S-14*m,S-14*m,16*m);x.stroke();if(t.s){x.save();x.translate(px+S/2,py+S/2);x.rotate(.25);x.fillStyle=t.s==2?'#fff1a2':'#9cf8ff';if(t.s==2){x.beginPath();x.moveTo(0,-22*m);x.lineTo(6*m,-4*m);x.lineTo(20*m,0);x.lineTo(6*m,4*m);x.lineTo(0,22*m);x.lineTo(-6*m,4*m);x.lineTo(-20*m,0);x.lineTo(-6*m,-4*m);x.closePath();x.fill()}else{x.beginPath();for(let i=0;i<6;i++){let a=i*1.05-1.57;x.lineTo(Math.cos(a)*18*m,Math.sin(a)*18*m)}x.closePath();x.fill()}x.restore()}if(t.g){x.strokeStyle='#fff';x.lineWidth=3*m;rr(px+5*m,py+5*m,S-10*m,S-10*m,17*m);x.stroke()}}
function drawCover(){ui={};bg();txt('PRISM PONY',W/2,H*.18,Math.min(46,W*.06));txt('DELUXE RAINBOW MATCH',W/2,H*.22,Math.min(22,W*.028),'center','#ffe89a');x.fillStyle='#0c1436bb';let pw=Math.min(560,W-48),ph=Math.min(290,H*.35),px=(W-pw)/2,py=H*.29;rr(px,py,pw,ph,30);x.fill();txt('A magical fullscreen rainbow match game',W/2,py+40,Math.min(24,W*.03));x.font='700 '+Math.min(18,W*.022)+'px system-ui';x.textAlign='center';x.fillStyle='#dbe2ff';['Match 3+ gems to restore color','Chain rainbow order for RAINBOW RUSH','Use tools to fight storm clouds','Sound on • Mobile + Desktop ready'].forEach((t,i)=>x.fillText(t,W/2,py+88+i*38));button('start',W/2-135,py+ph+40,270,72,'START',0,'#ff6aa8');txt('Best '+best.toLocaleString(),W/2,py+ph+148,18);button('sound',W-124,24,100,40,muted?'SOUND OFF':'SOUND ON',0,'#101836')}

7);x.fill();x.globalAlpha=1;if(i==step&&step<7){x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(66+(W-132)*i/6,164,24,0,7);x.stroke()}}x.font='700 12px system-ui';x.textAlign='center';x.fillStyle='#d9dfff';x.fillText(msg,W/2,214);[['BRUSH',tools[0],0,'#ff6ca9'],['BREAK',tools[1],1,'#5cbcff'],['BURST',tools[2],2,'#ffd35f']].forEach((p,i)=>button('t'+i,34+i*((W-68)/3),(226),(W-88)/3,34,`${p[0]} ${p[1]}`,tool==i,p[3]));x.fillStyle='#111936d8';rr(24,H-82,W-48,56,22);x.fill();x.font='700 12px system-ui';x.fillStyle='#b9c7f8';x.textAlign='center';x.fillText('Match the glowing rainbow color • tools help fight the storm',W/2,H-48)}}
function wrap(t,a,b,w,lh){let s=t.split(' '),line='';for(let i=0;i<s.length;i++){let n=line+s[i]+' ';if(x.measureText(n).width>w){x.fillText(line,a+w/2,b);line=s[i]+' ';b+=lh}else line=n}x.fillText(line,a+w/2,b)}
function board(){x.fillStyle='#0a1028cc';rr(X-12,Y-12,B+24,B+24,30);x.fill();x.strokeStyle='#ffffff22';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(X+i*S,Y);x.lineTo(X+i*S,Y+B);x.stroke();x.beginPath();x.moveTo(X,Y+i*S);x.lineTo(X+B,Y+i*S);x.stroke()}for(let r=0;r<N;r++)for(let c=0;c<N;c++)gem(b[r][c],r,c);if(sel&&sel.pop){x.strokeStyle='#fff';x.lineWidth=Math.max(2,S/18);rr(X+sel[1]*S+1,Y+sel[0]*S+1,S-2,S-2,S*.28);x.stroke()}for(let p of particles){x.globalAlpha=p.a;x.fillStyle=cols[p.c];x.fillRect(p.x,p.y,p.s,p.s);x.globalAlpha=1}}
function overlay(){if(!over)return;x.fillStyle='#070c20b8';x.fillRect(0,0,W,H);let pw=Math.min(392,W-48),ph=238,px=(W-pw)/2,py=(H-ph)/2;x.fillStyle='#101735';rr(px,py,pw,ph,32);x.fill();x.strokeStyle='#ffffff55';x.lineWidth=3;rr(px+3,py+3,pw-6,ph-6,30);x.stroke();txt(over==1?'RAINBOW RESTORED!':'THE STORM WON',W/2,py+66,28);txt('Score '+score,W/2,py+106,20);txt('Best '+best,W/2,py+136,18,'center','#d6ddff');button('again',W/2-120,py+174,240,48,'PLAY AGAIN',0,over==1?'#ff7bb0':'#6b79ff')}
function draw(){scr?drawGame():drawCover();scr&&board();overlay()}
function matches(){let rs=[];for(let r=0;r<N;r++)for(let c=0;c<N;){let q=b[r][c].c,j=c+1;while(q>=0&&j<N&&b[r][j].c==q)j++;if(j-c>2){let a=[];for(let k=c;k<j;k++)a.push([r,k]);rs.push(a)}c=j}for(let c=0;c<N;c++)for(let r=0;r<N;){let q=b[r][c].c,j=r+1;while(q>=0&&j<N&&b[j][c].c==q)j++;if(j-r>2){let a=[];for(let k=r;k<j;k++)a.push([k,c]);rs.push(a)}r=j}return rs}
function nearCloud(set){for(let z of [...set]){let[r,c]=z.split(',').map(Number);for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let a=r+d[0],v=c+d[1];if(I(a,v)&&b[a][v].c<0)set.add(k(a,v))}}}
function pop(r,c,col){for(let i=0;i<5;i++)particles.push({x:X+c*S+S/2,y:Y+r*S+S/2,c:col,s:R(3,7)*S/66,vx:R(-2.7,2.7)*S/66,vy:R(-4.5,-.7)*S/66,a:1})}
function fill(){for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--)if(b[r][c])b[w--][c]=b[r][c];while(w>=0)b[w--][c]=tile((Math.random()*7)|0)}}
function reward(n){let q=Math.random()*3|0;tools[q]+=n>1?2:1;msg=(n>1?'Unicorn combo! ':'Sweet! ')+'Tool found';sfx('tool')}
function burst(set){nearCloud(set);for(let z of [...set]){let[r,c]=z.split(',').map(Number),t=b[r][c];if(t&&t.c>=0){if(t.s==1)for(let a=0;a<N;a++)for(let v=0;v<N;v++)if(b[a][v].c==t.c)set.add(k(a,v));if(t.s==2)for(let i=0;i<N;i++)set.add(k(r,i)),set.add(k(i,c))}}nearCloud(set);let n=0;for(let z of set){let[r,c]=z.split(',').map(Number),t=b[r][c];if(t&&t.c>=0){pop(r,c,t.c);n++;sfx('pop')}b[r][c]=null}score+=n*n*8;fill();return n}
function resolve(){let rs=matches();if(!rs.length){if(cloudNext){cloud();cloudNext=0}busy=0;endCheck();return}let set=new Set,sp=[],seen=new Set,mx=0;rs.forEach(a=>{let col=b[a[0][0]][a[0][1]].c;seen.add(col);a.forEach(p=>set.add(k(p[0],p[1])));mx=Math.max(mx,a.length);if(a.length>3){let p=a[a.length>>1];sp.push([p[0],p[1],a.length>4?2:1,col]);set.delete(k(p[0],p[1]))}});burst(set);for(let q of sp)b[q[0]][q[1]]=tile(q[3],q[2]);if(mx>3)reward(mx>4?2:1);if(seen.has(step)){step++;score+=250;if(step==7){step=0;runs++;score+=2500;flash=10;msg='RAINBOW RUSH! The sky remembers its colors!';sfx('rush');for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(b[r][c]&&b[r][c].c>=0&&Math.random()<.3)b[r][c]=null;fill()}}else msg='Chain colors in rainbow order for a Rainbow Rush';setTimeout(resolve,170)}
function cloud(){let q=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(b[r][c].c>=0&&!b[r][c].s)q.push([r,c]);for(let i=0;i<Math.min(3,q.length);i++){let j=(Math.random()*q.length)|0,p=q.splice(j,1)[0];b[p[0]][p[1]]=tile(-1)}msg='Storm clouds fell — use BREAK or match beside them!';tone(160,.18,.04,'sawtooth')}
function swap(a,d){if(busy||moves<1||over)return;let[r,c]=a,[R,C]=d;if(!I(R,C)||Math.abs(r-R)+Math.abs(c-C)!=1||b[r][c].c<0||b[R][C].c<0)return;busy=1;[b[r][c],b[R][C]]=[b[R][C],b[r][c]];sfx('swap');if(!matches().length){[b[r][c],b[R][C]]=[b[R][C],b[r][c]];busy=0;msg='No match — try another swap';sfx('bad');return}moves--;cloudNext=moves&&moves%5==0;resolve()}
function useTool(rc){if(tool<0||busy||over||moves<1||!I(...rc))return 0;let[r,c]=rc,t=b[r][c];if(tool==0&&t.c>=0){b[r][c]=tile(step);tools[0]--;score+=40;msg='Rainbow Brush painted the current target color';tool=-1;sfx('tool');matches().length?resolve():0;return 1}if(tool==1&&t.c<0){b[r][c]=tile((Math.random()*7)|0);tools[1]--;score+=60;msg='Cloud Breaker cleared the storm';tool=-1;sfx('tool');fill();resolve();return 1}if(tool==2){let set=new Set;for(let a=-1;a<2;a++)for(let v=-1;v<2;v++)I(r+a,c+v)&&set.add(k(r+a,c+v));tools[2]--;score+=80;msg='Prism Burst popped a 3×3 area';tool=-1;sfx('tool');burst(set);resolve();return 1}msg=tool==1?'Use BREAK on a gray cloud':'Use the tool on a gem';sfx('bad');return 0}
function endCheck(){if(runs>=3&&!over){over=1;best=Math.max(best,score);localStorage.pp_best=best;sfx('win')}else if(moves<=0&&!busy&&!over){over=2;best=Math.max(best,score);localStorage.pp_best=best;sfx('lose')}}
function pt(e){let r=C.getBoundingClientRect(),px=(e.clientX-r.left)*C.width/r.width,py=(e.clientY-r.top)*C.height/r.height;return [px,py]}
function cell(e){let[pX,pY]=pt(e);return [Math.floor((pY-Y)/S),Math.floor((pX-X)/S),pX,pY]}
C.onpointerdown=e=>{A();down=cell(e)};
C.onpointerup=e=>{A();let a=down,d=cell(e),px=d[2],py=d[3];if(hit('sound',px,py)){muted=!muted;sfx('tap');return}if(!scr){if(hit('start',px,py)){scr=1;newGame();sfx('rush')}else sfx('tap');return}if(hit('again',px,py)){newGame();sfx('rush');return}for(let i=0;i<3;i++)if(hit('t'+i,px,py)){tool=tool==i?-1:i;sel=0;sfx('tap');return}if(moves<1||over)return;let rc=[d[0],d[1]];if(tool>=0&&I(...rc))return void useTool(rc);if(!a||!I(a[0],a[1]))return;let u=[a[0],a[1]],v=[d[0],d[1]];if(I(...v)&&Math.abs(u[0]-v[0])+Math.abs(u[1]-v[1])==1){sel=0;swap(u,v)}else if(!sel)sel=u;else{let q=sel;sel=0;swap(q,v)}};
function loop(){for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.18*S/66;p.a-=.025}particles=particles.filter(p=>p.a>0);draw();requestAnimationFrame(loop)}loop();
